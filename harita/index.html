<script>
/* =====================================================================
   ÜSTAD GÖZCÜ — v0.9.0 ek paket
   A) Sesli anons (Türkçe)          B) Uçak/gemi izi (arşivden)
   C) Deprem dalgası (yayılan halka) D) Ekran koruyucu (harekât odası)
   E) Günlük rapor                   F) KML içe aktarma (geofence)
   G) Türkiye il sınırları           H) TV modunda 3D eğim
   ===================================================================== */
(function(){
  if(window.__ek2) return; window.__ek2 = true;
  const $1 = s => document.querySelector(s);
  const kac = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function toast(metin, ms){
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = metin;
    document.body.appendChild(t); setTimeout(() => t.remove(), ms || 4500);
  }

  /* ---------- A) SESLİ ANONS ---------- */
  let sesAcik = (localStorage.getItem('ustad-gozcu-ses') !== '0');
  function anons(metin){
    if(!sesAcik || !window.speechSynthesis) return;
    try {
      const u = new SpeechSynthesisUtterance(metin);
      u.lang = 'tr-TR'; u.rate = 1.03; u.pitch = 1;
      window.speechSynthesis.speak(u);
    } catch(e){}
  }
  window.gozcuAnons = anons;

  // yeni büyük deprem (M>=4,5) → anons; ilk turda mevcutlar sessizce işaretlenir
  let anonsGorulen = null, anonsZaman = null;
  async function anonsTara(){
    try {
      const c = await (await fetch('/veri/deprem')).json();
      const liste = c.depremler || [];
      if(anonsGorulen === null){
        anonsGorulen = {};
        liste.forEach(d => anonsGorulen[(d.yer||'') + '|' + d.m] = 1);
        return;
      }
      liste.forEach(d => {
        const anahtar = (d.yer||'') + '|' + d.m;
        if(anonsGorulen[anahtar]) return;
        anonsGorulen[anahtar] = 1;
        if((d.m || 0) >= 4.5){
          anons('Deprem. Büyüklük ' + String(Number(d.m).toFixed(1)).replace('.', ' virgül') +
                '. ' + (d.yer || ''));
        }
      });
    } catch(e){}
  }

  // sunucudaki uyarı motorunun kayıtlarını da sesli oku
  let uyariSonAdet = null;
  async function uyariAnonsTara(){
    try {
      const c = await (await fetch('/veri/uyari')).json();
      const olaylar = [];
      (c.bolgeler || []).forEach(z => (z.olaylar || []).slice(0,3).forEach(o => olaylar.push({z:z.ad, o:o})));
      if(uyariSonAdet === null){ uyariSonAdet = olaylar.length; return; }
      if(olaylar.length > uyariSonAdet){
        const yeni = olaylar[0];
        anons(yeni.z + ' bölgesinde yeni kayıt. ' + (yeni.o.ad || ''));
        toast('🔔 ' + yeni.z + ' — ' + (yeni.o.ad || ''), 6000);
      }
      uyariSonAdet = olaylar.length;
    } catch(e){}
  }

  /* ---------- B) UÇAK / GEMİ İZİ ---------- */
  const KAYNAK_KAT = {ucaklar:'ucak', ucakcanli:'ucak', gemiler:'gemi', gemicanli:'gemi'};
  async function izGoster(kat, ad){
    try {
      const c = await (await fetch('/veri/arsiv/iz?kat=' + kat + '&ad=' + encodeURIComponent(ad))).json();
      if(!c.nokta){
        toast('Arşivde iz bulunamadı: ' + ad + ' (kayıt birikiyor, 2 dakikada bir ekleniyor).');
        return;
      }
      const fc = {type:'FeatureCollection', features:[{type:'Feature', properties:{ad:c.ad, n:c.nokta},
        geometry:{type:'LineString', coordinates:c.iz.map(x => [x[2], x[1]])}}]};
      if(!harita.getSource('iz-hat')){
        harita.addSource('iz-hat', {type:'geojson', data:fc});
        harita.addLayer({id:'iz-hat-cizgi', type:'line', source:'iz-hat',
          paint:{'line-color':'#ffd23b','line-width':2,'line-dasharray':[2,1.4]}});
      } else harita.getSource('iz-hat').setData(fc);
      const lo = c.iz.map(x => x[2]), la = c.iz.map(x => x[1]);
      harita.fitBounds([[Math.min(...lo), Math.min(...la)], [Math.max(...lo), Math.max(...la)]],
                       {padding:90, duration:1600, maxZoom:9});
      toast('İZ: ' + c.ad + ' · ' + c.nokta + ' nokta · son 72 saat');
    } catch(e){ toast('İz alınamadı.'); }
  }
  harita.on('click', e => {
    try {
      const vurulan = harita.queryRenderedFeatures(e.point).filter(f =>
        f.source && KAYNAK_KAT[f.source] && f.geometry && f.geometry.type === 'Point');
      if(!vurulan.length) return;
      const f = vurulan[0], p = f.properties || {};
      const ad = p.ad || p.c || p.m || '';
      if(!ad) return;
      izGoster(KAYNAK_KAT[f.source], ad);
    } catch(err){}
  });

  /* ---------- C) DEPREM DALGASI ---------- */
  let dalgaAcik = false, dalgaZaman = null, dalgaListe = [];
  async function dalgaMerkezAl(){
    try {
      const c = await (await fetch('/veri/deprem')).json();
      // Son 24 saatin en büyük 12 depremi — halkalar nerede olursa olsun görünür
      dalgaListe = (c.depremler || []).slice()
        .sort((a,b) => (b.m||0) - (a.m||0)).slice(0, 12);
    } catch(e){ dalgaListe = []; }
  }
  function dalgaCiz(){
    if(!dalgaListe.length) return;
    const t = (Date.now() % 3000) / 3000;
    const ozellikler = [];
    dalgaListe.forEach((d, j) => {
      for(let i = 0; i < 2; i++){
        const f = (t + i / 2 + j * 0.07) % 1;
        ozellikler.push({type:'Feature',
          properties:{y:f, m:Number(d.m || 0), ad:d.yer || 'deprem'},
          geometry:{type:'Point', coordinates:[d.lo, d.la]}});
      }
    });
    const fc = {type:'FeatureCollection', features:ozellikler};
    if(!harita.getLayer('dalga-halka')){
      if(!harita.getSource('dalga')) harita.addSource('dalga', {type:'geojson', data:fc});
      harita.addLayer({id:'dalga-halka', type:'circle', source:'dalga',
        paint:{
          'circle-radius':['*', ['get','y'], ['+', 90, ['*', ['get','m'], 26]]],
          'circle-color':'transparent',
          'circle-stroke-width':['+', 1.2, ['*', ['get','m'], 0.18]],
          'circle-stroke-color':'rgba(255,138,61,.9)',
          'circle-stroke-opacity':['-', 1, ['get','y']],
        }});
    }
    harita.getSource('dalga').setData(fc);
  }
  function dalgaBaslat(){
    dalgaAcik = true;
    dalgaMerkezAl().then(() => {
      if(dalgaListe.length){
        const en = dalgaListe[0];
        toast('Deprem dalgası açık — son 24 saatin en büyük ' + dalgaListe.length +
              ' depremi (en büyüğü M' + (en.m || '?') + ' · ' + (en.yer || '') + ')');
      } else toast('Deprem verisi yok.');
    });
    dalgaCiz();
    clearInterval(dalgaZaman); dalgaZaman = setInterval(dalgaCiz, 70);
    setInterval(dalgaMerkezAl, 120000);
  }
  function dalgaDurdur(){
    dalgaAcik = false; clearInterval(dalgaZaman); dalgaZaman = null;
    if(harita.getLayer('dalga-halka')) harita.removeLayer('dalga-halka');
    if(harita.getSource('dalga')) harita.removeSource('dalga');
  }

  /* ---------- D) EKRAN KORUYUCU ---------- */
  let koruyucuAcik = (localStorage.getItem('ustad-gozcu-koruyucu') !== '0');
  let sonHareket = Date.now();
  const KORUYUCU_SN = 300;
  ['mousemove','keydown','click','wheel','touchstart'].forEach(ev =>
    document.addEventListener(ev, () => { sonHareket = Date.now(); }, {passive:true}));
  setInterval(() => {
    if(!koruyucuAcik) return;
    if($1('#hko').classList.contains('acik')) return;
    if($1('#vd').classList.contains('acik')) return;
    if($1('#tv').classList.contains('acik')) return;
    if(Date.now() - sonHareket > KORUYUCU_SN * 1000){
      toast('Gözcü nöbete geçti — harekât odası açıldı.');
      window.harekatAc();
    }
  }, 15000);

  /* ---------- E) GÜNLÜK RAPOR ---------- */
  async function raporAc(){
    toast('Rapor hazırlanıyor…');
    try {
      const c = await (await fetch('/veri/rapor')).json();
      pencereAc('GÜNLÜK DURUM RAPORU · ' + c.tarih, c.metin.split('\n'));
      const govde = $1('#bp-govde');
      const d = document.createElement('button');
      d.textContent = 'RAPORU İNDİR (.txt)';
      d.style.cssText = 'margin-top:10px;background:#0e161c;color:#8fe36b;border:1px solid #2a4a3a;' +
        'border-radius:7px;padding:6px 12px;cursor:pointer;font:600 11px var(--ui)';
      d.onclick = () => {
        const b = new Blob(['\ufeff' + c.metin], {type:'text/plain;charset=utf-8'});
        const u = URL.createObjectURL(b), a = document.createElement('a');

        document.body.appendChild(a); a.click(); a.remove();

  /* ---------- F) KML İÇE AKTARMA ---------- */
  function kmlIcAl(){
    const g = document.createElement('input');
    g.type = 'file'; g.accept = '.kml,application/vnd.google-earth.kml+xml';
    // GÖVDEYE EKLEMEDEN click() dosya penceresini AÇMAZ (tarayıcı kuralı)
    g.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(g);
    g.onchange = async () => {
      const dosya = g.files && g.files[0]; if(!dosya) return;
      const metin = await dosya.text();
      const hat = new DOMParser().parseFromString(metin, 'text/xml');
      if(hat.querySelector('parsererror')){ toast('KML okunamadı (bozuk dosya).'); return; }
      let alan = 0, cizgi = 0;
      const cizgiler = [];
      // alanlar → uyarı bölgesi
      for(const p of [...hat.querySelectorAll('Polygon')]){
        const metinler = [...p.querySelectorAll('coordinates')].map(c => c.textContent.trim()).join(' ');
        const noktalar = metinler.split(/\s+/).map(s => s.split(',').map(Number))
          .filter(a => a.length >= 2 && isFinite(a[0]) && isFinite(a[1]));
        if(noktalar.length < 3) continue;
        const lolar = noktalar.map(a => a[0]), lalar = noktalar.map(a => a[1]);
        const kutu = [Math.min(...lolar), Math.min(...lalar), Math.max(...lolar), Math.max(...lalar)];
        const adlar = p.getElementsByTagName('name');
        const ad = (adlar.length && adlar[0].textContent) || ('KML alanı ' + (alan + 1));
        try {
          await fetch('/veri/uyari', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ad: ad.slice(0,60), kutu: kutu})});
          alan++;
        } catch(e){}
      }
      // çizgiler → haritada göster
      [...hat.querySelectorAll('LineString')].forEach(l => {
        const noktalar = (l.querySelector('coordinates') || {}).textContent || '';
        const koord = noktalar.trim().split(/\s+/).map(s => s.split(',').map(Number))
          .filter(a => a.length >= 2 && isFinite(a[0]) && isFinite(a[1])).map(a => [a[0], a[1]]);
        if(koord.length > 1){ cizgiler.push({type:'Feature', properties:{}, geometry:{type:'LineString', coordinates:koord}}); cizgi++; }
      });
      if(cizgiler.length){
        const fc = {type:'FeatureCollection', features:cizgiler};
        if(!harita.getSource('kml-hat')){
          harita.addSource('kml-hat', {type:'geojson', data:fc});
          harita.addLayer({id:'kml-hat-cizgi', type:'line', source:'kml-hat',
            paint:{'line-color':'#ff9ecb','line-width':2}});
        } else harita.getSource('kml-hat').setData(fc);
      }
      toast('KML alındı: ' + alan + ' uyarı alanı, ' + cizgi + ' çizgi.');
      if(alan) setTimeout(() => { document.querySelector('#ek-uyliste').click(); }, 600);
      setTimeout(() => g.remove(), 30000);
    };
    g.click();
  }

  /* ---------- G) TÜRKİYE İL SINIRLARI ---------- */
  let ilAcik = false;
  async function ilAcKapa(){
    if(ilAcik){
      ilAcik = false;
      $1('#ek-il').classList.remove('aktif');
      if(harita.getLayer('il-cizgi')) harita.removeLayer('il-cizgi');

      if(harita.getSource('iller')) harita.removeSource('iller');
      toast('İl sınırları kapatıldı.');
      return;
    }
    try {
      const c = await (await fetch('/veri/il')).json();
      const fc = {type:'FeatureCollection', features: c.iller.map(x => ({
        type:'Feature', properties:{ad:x.ad}, geometry:x.geometry}))};
      harita.addSource('iller', {type:'geojson', data:fc});
      harita.addLayer({id:'il-dolgu', type:'fill', source:'iller',
        paint:{'fill-color':'#2bf0c8','fill-opacity':.045}});
      harita.addLayer({id:'il-cizgi', type:'line', source:'iller',
        paint:{'line-color':'#2bf0c8','line-width':1,'line-opacity':.6}});
      try { const alt = ilkVeriKatmani(); if(alt) { harita.moveLayer('il-dolgu', alt); harita.moveLayer('il-cizgi', alt); } } catch(e){}
      ilAcik = true;
      $1('#ek-il').classList.add('aktif');
      toast(c.sayi + ' il sınırı çizildi (kaynak: açık GeoJSON).');
    } catch(e){ toast('İl sınırları alınamadı.'); }
  }

  /* ---------- H) TV MODUNDA 3D EĞİM ---------- */
  new MutationObserver(() => {
    const tvAcik = document.body.classList.contains('tv');
    if(tvAcik && !window.__tvEgim){
      try { harita.easeTo({pitch:55, duration:1600}); } catch(e){}
      window.__tvEgim = setInterval(() => {
        try { harita.easeTo({bearing:(harita.getBearing() + 0.35) % 360, duration:1000}); } catch(e){}
      }, 1000);
    } else if(!tvAcik && window.__tvEgim){
      clearInterval(window.__tvEgim); window.__tvEgim = null;
      try { harita.easeTo({pitch:0, bearing:0, duration:1400}); } catch(e){}
    }
  }).observe(document.body, {attributes:true, attributeFilter:['class']});

  /* ---------- DÜĞMELER ---------- */
  const SV = {
    dalga:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="2.4"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="10.5" stroke-dasharray="2 2"/></svg>',
    iz:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 17c4 0 5-9 9-9s5 9 9 9"/><circle cx="12" cy="8" r="1.6"/></svg>',
    ses:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 9v6h3l5 4V5L7 9z"/><path d="M16 9.5a4 4 0 010 5"/></svg>',
    koruyucu:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>',
    rapor:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 3h9l5 5v13H6z"/><path d="M9 12h7M9 16h7M9 8h3"/></svg>',
    kml:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M4 19h16"/></svg>',
    il:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2z"/><path d="M9 4v14M15 6v14"/></svg>'
  };
  function dugme(id, baslik, svg, tikla){
    const b = document.createElement('button');
    b.id = id; b.title = baslik; b.innerHTML = svg; b.onclick = tikla;
    $1('#sol-alt').appendChild(b);
    return b;
  }
  dugme('ek-dalga', 'Deprem dalgası (yayılan halkalar)',
    SV.dalga, () => { dalgaAcik ? dalgaDurdur() : dalgaBaslat(); $1('#ek-dalga').classList.toggle('aktif', dalgaAcik); });
  dugme('ek-iz', 'İz göster: uçağa/gemiye tıkla', SV.iz,
    () => toast('Haritada bir uçağa ya da gemiye tıkla: son 72 saatlik izi çizilir.'));
  dugme('ek-ses', 'Sesli anons (Türkçe)', SV.ses, () => {
    sesAcik = !sesAcik;
    localStorage.setItem('ustad-gozcu-ses', sesAcik ? '1' : '0');
    $1('#ek-ses').classList.toggle('aktif', sesAcik);
    toast('Sesli anons ' + (sesAcik ? 'AÇIK' : 'kapalı'));
    if(sesAcik) anons('Sesli anons açıldı.');
  });
  dugme('ek-koruyucu', 'Ekran koruyucu (5 dk hareketsizlik → harekât odası)', SV.koruyucu, () => {
    koruyucuAcik = !koruyucuAcik;
    localStorage.setItem('ustad-gozcu-koruyucu', koruyucuAcik ? '1' : '0');
    $1('#ek-koruyucu').classList.toggle('aktif', koruyucuAcik);
    toast('Ekran koruyucu ' + (koruyucuAcik ? 'AÇIK (5 dakika)' : 'kapalı'));
  });
  dugme('ek-rapor', 'Günlük durum raporu', SV.rapor, raporAc);
  dugme('ek-kml', 'KML içe aktar (Google Earth alanı)', SV.kml, kmlIcAl);
  dugme('ek-il', 'Türkiye il sınırları', SV.il, () => ilAcKapa());
  $1('#ek-ses').classList.toggle('aktif', sesAcik);

  /* döngüler */

  setTimeout(anonsTara, 8000);
  setInterval(uyariAnonsTara, 25000);
  setTimeout(uyariAnonsTara, 12000);

<script>
/* =====================================================================
   ÜSTAD GÖZCÜ — v0.10.0 CANLI UÇAK HAREKETİ (ölü hesap / dead reckoning)
   Uçaklar 30 saniyede bir güncellenen raporda zıplamaz; her rapordaki
   HIZ (g, km/s) ve YÖN (d, derece) ile konum saniye saniye ilerletilir.
   Sahte veri yok: hız/yön bilinmiyorsa uçak yerinde durur.
   ===================================================================== */
(function(){
  if(window.__ek3) return; window.__ek3 = true;
  const $1 = s => document.querySelector(s);
  const SRC = 'ucakcanli', KAT = 'ucak-canli-ikon', EN_FAZLA = 2500;
  function toast(metin, ms){
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = metin;
    document.body.appendChild(t); setTimeout(() => t.remove(), ms || 4500);
  }

  let acik = (localStorage.getItem('ustad-gozcu-hareket') !== '0');
  let zaman = null, sonTik = 0, sonHam = null;
  let surukle = new Map();          // h → {f, la, lo, g, d}
  let kuruldu = false;

  function kaynakKur(){
    if(kuruldu) return true;
    if(!harita.loaded()) return false;
    try {
      if(!harita.getSource(SRC)) harita.addSource(SRC, {type:'geojson',
        data:{type:'FeatureCollection', features:[]}});
      if(!harita.getLayer(KAT)) harita.addLayer({
        id:KAT, type:'symbol', source:SRC,
        layout:{
          'icon-image':['case',
            ['==',['get','y'],1], 'ucak-yerde',
            ['<',['get','a'],12000], 'ucak-alcak',
            ['<',['get','a'],30000], 'ucak-orta',
            'ucak-yuksek'],
          'icon-size':['interpolate',['linear'],['zoom'],2,.55,6,.75,10,1.0],
          'icon-rotate':['get','d'],
          'icon-rotation-alignment':'map',
          'icon-allow-overlap':true,
          'icon-ignore-placement':true,
        }});
      harita.moveLayer(KAT, 'ucak-ikon');
      kuruldu = true;
      return true;
    } catch(e){ return false; }
  }

  function tik(){
    if(!acik) return;
    if(!kaynakKur()) return;
    const kaynak = harita.getSource('ucaklar');
    const ham = kaynak && kaynak._data;
    if(!ham || !ham.features || !ham.features.length) return;

    const simdi = Date.now();
    const dt = sonTik ? Math.min(3000, simdi - sonTik) / 1000 : 0;
    sonTik = simdi;

    // Yeni rapor geldiyse: eski kayıtları bırak (uçak listesi değişmiş olabilir)
    if(ham !== sonHam){
      const yeni = new Map();
      for(const f of ham.features){
        const p = f.properties || {};
        const a = (p.h != null ? p.h : p.c);
        if(a == null) continue;
        yeni.set(a, {f:f, la:Number(p.la), lo:Number(p.lo),
                     g:Number(p.g)||0, d:Number(p.d)||0});
      }
      surukle = yeni; sonHam = ham;
    } else if(dt > 0){
      for(const k of surukle.values()){
        const p = k.f.properties || {};
        if(p.y) continue;                       // yerdeki uçak kaymasın
        k.g = Number(p.g) || 0;
        k.d = Number(p.d) || 0;
        if(k.g <= 5) continue;                  // hız yoksa yerinde dur (uydurma yok)
        const v = k.g * 0.514444;               // KNOT → m/s (g knot cinsindendir!)
        const a = k.d * Math.PI / 180;
        k.la += (v * dt * Math.cos(a)) / 111320;
        const cosLa = Math.cos(k.la * Math.PI / 180);
        k.lo += (v * dt * Math.sin(a)) / (111320 * (Math.abs(cosLa) < 0.02 ? 0.02 : cosLa));
        if(k.lo > 180) k.lo -= 360;
        if(k.lo < -180) k.lo += 360;
      }
    }

    // Görünen alan (+%30 pay) — dışarıdakiler çizilmez, hesabı yine de yapılır
    const s = harita.getBounds();
    const dLo = (s.getEast() - s.getWest()) * 0.3;
    const dLa = (s.getNorth() - s.getSouth()) * 0.3;
    const b0 = s.getWest() - dLo, b1 = s.getEast() + dLo;
    const g0 = s.getSouth() - dLa, g1 = s.getNorth() + dLa;

    const icerde = [];
    for(const k of surukle.values()){
      if(k.la >= g0 && k.la <= g1 && k.lo >= b0 && k.lo <= b1) icerde.push(k);
    }
    const adim = icerde.length > EN_FAZLA ? Math.ceil(icerde.length / EN_FAZLA) : 1;
    const cikti = [];
    for(let i = 0; i < icerde.length; i += adim){
      const k = icerde[i];
      cikti.push({type:'Feature', properties:k.f.properties,
                  geometry:{type:'Point', coordinates:[k.lo, k.la]}});
    }
    try {
      harita.getSource(SRC).setData({type:'FeatureCollection', features:cikti});
      harita.setLayoutProperty('ucak-ikon', 'visibility', 'none');
      let acikKat = true;
      try { acikKat = (typeof katmanDurum !== 'undefined') ? (katmanDurum.ucak !== false) : true; } catch(e){}
      harita.setLayoutProperty(KAT, 'visibility', acikKat ? 'visible' : 'none');
    } catch(e){}
  }

  function baslat(){
    if(!kaynakKur()){
      toast('Harita henüz hazır değil, 3 saniye sonra yeniden denenecek.');
      setTimeout(() => { if(acik) baslat(); }, 3000);
      return;
    }
    acik = true; sonTik = 0;
    localStorage.setItem('ustad-gozcu-hareket', '1');
    const b = $1('#ek-hareket'); if(b) b.classList.add('aktif');
    clearInterval(zaman); zaman = setInterval(tik, 200);
    setTimeout(() => {
      const n = ciktiSayisi();
      toast('Uçaklar canlı hareket: AÇIK — ekranda ' + n + ' uçak akıyor (hız/yön ile).');
    }, 700);
  }
  function durdur(){
    acik = false;
    clearInterval(zaman); zaman = null;
    localStorage.setItem('ustad-gozcu-hareket', '0');
    const b = $1('#ek-hareket'); if(b) b.classList.remove('aktif');
    try {
      if(harita.getLayer(KAT)) harita.setLayoutProperty(KAT, 'visibility', 'none');
      let acikKat = true;
      try { acikKat = (typeof katmanDurum !== 'undefined') ? (katmanDurum.ucak !== false) : true; } catch(e){}
      harita.setLayoutProperty('ucak-ikon', 'visibility', acikKat ? 'visible' : 'none');
    } catch(e){}
    toast('Canlı hareket durdu — uçaklar 30 saniyelik raporla zıplayarak güncellenir.');
  }
  function ciktiSayisi(){
    try {
      const k = harita.getSource(SRC);
      return k && k._data ? k._data.features.length : 0;
    } catch(e){ return 0; }
  }
  window.gozcuHareket = {baslat, durdur, durum: () => acik, sayi: ciktiSayisi,
                         katman: KAT, noktalar: () => Array.from(surukle.values())};

  /* uçağa tıklayınca bilgi kutusu (statik katman gizli olduğu için burada) */
  harita_tikla();
  function harita_tikla(){
    harita.on('click', KAT, e => {
      const p = e.features[0].properties || {};
      const ad = v => (v === null || v === undefined || v === '') ? '—' : v;
      try {
        bilgiKutusu._yer = e.lngLat;
        bilgiKutusu(ad(p.c || p.h), [
          satir('Tescil', ad(p.r)),
          satir('Tip', ad(p.t)),
          satir('İrtifa', Number(p.a || 0).toLocaleString('tr-TR') + ' ft'),
          satir('Hız', Math.round(p.g || 0) + ' kt'),
          satir('Yön', Math.round(p.d || 0) + '°'),
          satir('Tırmanış', (p.v > 0 ? '+' : '') + p.v + ' ft/dk'),
          satir('Konum', e.lngLat.lat.toFixed(3) + '°, ' + e.lngLat.lng.toFixed(3) + '°'),
        ].join(''));
      } catch(err){}
    });
  }

  /* düğme */
  const b = document.createElement('button');
  b.id = 'ek-hareket';
  b.title = 'Uçaklar canlı hareket (hız/yön ile pürüzsüz animasyon)';
  b.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 12h9"/><path d="M13 12l6-4"/><path d="M13 12l6 4"/><path d="M4 12l3-3M4 12l3 3"/></svg>';
  b.onclick = () => acik ? durdur() : baslat();
  $1('#sol-alt').appendChild(b);
  b.classList.toggle('aktif', acik);

  if(acik){
    const dene = () => {
      if(!acik) return;
      if(kaynakKur()){ baslat(); }
      else setTimeout(dene, 1500);
    };
    setTimeout(dene, 4000);
  }
  console.log('[ÜSTAD GÖZCÜ] v0.10.0 canlı uçak hareketi hazır (düğme: ek-hareket)');
})();
</script>
<script>
/* =====================================================================
   ÜSTAD GÖZCÜ — v0.11.0
   1) GEMİLER CANLI HAREKETİ (uçaklarla aynı ölü hesap; rota=y, hız=g knot)
   2) AÇILIŞ PERDESİ — sinematik giriş animasyonu + günün sözü
   ===================================================================== */
(function(){
  if(window.__ek4) return; window.__ek4 = true;
  const $1 = s => document.querySelector(s);
  function toast(metin, ms){
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = metin;
    document.body.appendChild(t); setTimeout(() => t.remove(), ms || 4500);
  }

  /* ================= 1) GEMİLER CANLI HAREKET ================= */
  const SRC = 'gemicanli', KAT = 'gemi-canli-ikon', EN_FAZLA = 2000;
  let acikGemi = (localStorage.getItem('ustad-gozcu-gemi-hareket') !== '0');
  let zamanG = null, sonTikG = 0, sonHamG = null, surukleG = new Map(), kurulduG = false;

  function gemiKaynakKur(){

        id:KAT, type:'symbol', source:SRC,
        layout:{
          'icon-image':'gemi-ikon',
          'icon-size':['interpolate',['linear'],['zoom'],2,.5,6,.72,10,1.0],
          'icon-rotate':['get','y'],
          'icon-rotation-alignment':'map',

        }});

    } catch(e){ return false; }
  }

  function gemiTik(){
    if(!acikGemi || !gemiKaynakKur()) return;
    const kaynak = harita.getSource('gemiler');
    const ham = kaynak && kaynak._data;
    if(!ham || !ham.features || !ham.features.length) return;
    const simdi = Date.now();
    const dt = sonTikG ? Math.min(3000, simdi - sonTikG) / 1000 : 0;
    sonTikG = simdi;
    if(ham !== sonHamG){
      const yeni = new Map();
      for(const f of ham.features){
        const p = f.properties || {};
        const a = (p.m != null ? p.m : p.la + ',' + p.lo);
        yeni.set(a, {f:f, la:Number(p.la), lo:Number(p.lo), g:Number(p.g)||0,
                     d:Number(p.y)||0});
      }
      surukleG = yeni; sonHamG = ham;
    } else if(dt > 0){
      for(const k of surukleG.values()){
        const p = k.f.properties || {};
        k.g = Number(p.g) || 0;
        const yon = Number(p.y);
        if(isFinite(yon) && yon !== 511) k.d = yon;
        if(k.g <= 0.8) continue;                  // demirli/limanda: yerinde dur
        const v = k.g * 0.514444;                 // knot → m/s
        const a = k.d * Math.PI / 180;
        k.la += (v * dt * Math.cos(a)) / 111320;
        const cosLa = Math.cos(k.la * Math.PI / 180);
        k.lo += (v * dt * Math.sin(a)) / (111320 * (Math.abs(cosLa) < 0.02 ? 0.02 : cosLa));
        if(k.lo > 180) k.lo -= 360;
        if(k.lo < -180) k.lo += 360;
      }
    }

  function katmanVar(k){ return !!(harita.getSource('y-' + k.id)); }

  /* harita nesnesi başka script bloğunda const ile tanımlı — window'da görünmez */
  function haritaVar(){
    try{ return typeof harita !== 'undefined' && !!harita && !!harita.getStyle
                && !!(harita.getStyle() || {}).layers; }
    catch(e){ return false; }
  }

  function katmanKur(k){
    if(KURULU[k.id]) return true;
    if(!haritaVar()) return false;
    const src = 'y-' + k.id;
    try{
      if(!harita.getSource(src))
        harita.addSource(src, {type:'geojson', data:{type:'FeatureCollection', features:[]}});
      const gizli = {visibility: 'visible'};
      if(k.tip === 'nokta'){
        harita.addLayer({id:src + '-nokta', type:'circle', source:src, layout:gizli,
          paint:{'circle-radius':['interpolate',['linear'],['zoom'],3,2.2,7,4.2,11,7],
                 'circle-color':k.renk,'circle-opacity':.85,
                 'circle-stroke-color':'#04080b','circle-stroke-width':.9}});
        harita.addLayer({id:src + '-ad', type:'symbol', source:src,
          minzoom:5, layout:Object.assign({}, gizli,
            {'text-field':['get','ad'],'text-size':9.5,'text-offset':[0,1.1],
             'text-anchor':'top','text-allow-overlap':false}),
          paint:{'text-color':'#e6f7f2','text-halo-color':'#04080b','text-halo-width':1.3}});
        harita.on('click', src + '-nokta', e => {
          const p = (e.features && e.features[0] && e.features[0].properties) || {};
          bilgiGoster((p.ad || k.ad) + ' · ' + k.ad, icerik(k, p.ham));
        });
        harita.on('mouseenter', src + '-nokta', () => { harita.getCanvas().style.cursor = 'pointer'; });
        harita.on('mouseleave', src + '-nokta', () => { harita.getCanvas().style.cursor = ''; });
      } else {
        harita.addLayer({id:src + '-cizgi', type:'line', source:src, layout:gizli,
          paint:{'line-color':k.renk,'line-opacity':.75,
                 'line-width':['interpolate',['linear'],['zoom'],2,.7,6,1.6,10,2.6]}});
        harita.on('click', src + '-cizgi', e => {
          const p = (e.features && e.features[0] && e.features[0].properties) || {};
          bilgiGoster((p.ad || k.ad), [['Tür', k.ad], ['Kaynak', 'açık veri']]);
        });
      }
      KURULU[k.id] = true;
      return true;
    }catch(e){ bildir(k.ad + ': katman kurulamadı (' + e.message + ')'); return false; }
  }

  async function katmanYukle(k){
    try{
      const c = await (await fetch(k.uc)).json();
      const liste = c[k.alan] || [];
      const fs = [];
      if(k.tip === 'nokta'){
        for(const x of liste){
          if(x.la == null || x.lo == null) continue;
          fs.push({type:'Feature', properties:{ad: x.ad || '—', ham: JSON.stringify(x)},
                   geometry:{type:'Point', coordinates:[x.lo, x.la]}});
        }
      } else {
        for(const x of liste) for(const hat of (x.k || [])){
          if(!hat || hat.length < 2) continue;
          fs.push({type:'Feature', properties:{ad: x.ad || ''},
                   geometry:{type:'LineString', coordinates:hat}});
        }
      }
      harita.getSource('y-' + k.id).setData({type:'FeatureCollection', features:fs});
      return fs.length;
    }catch(e){ bildir(k.ad + ': veri alınamadı (' + k.uc + ')'); return 0; }
  }

  function katmanGoster(k, v){
    const taban = 'y-' + k.id;
    const idler = k.tip === 'nokta' ? [taban + '-nokta', taban + '-ad'] : [taban + '-cizgi'];
    idler.forEach(id => { try{ harita.setLayoutProperty(id, 'visibility', v ? 'visible' : 'none'); }catch(e){} });
  }

  async function katmanDegistir(k){
    if(!acik[k.id]){                                   /* aç */
      if(!katmanKur(k)){ bildir('Harita henüz hazır değil, bir saniye sonra deneyin.'); return; }
      acik[k.id] = true; yaz('yeni-acik', acik); katmanGoster(k, true);
      panelTazele();
      bildir(k.ad + ': yükleniyor…', 6000);
      const n = await katmanYukle(k);
      bildir(k.ad + ': ' + n + ' kayıt' + (n ? '' : ' — kaynak veri döndürmedi'));
    } else {                                           /* kapat */
      acik[k.id] = false; yaz('yeni-acik', acik); katmanGoster(k, false);
      panelTazele();
      bildir(k.ad + ' kapatıldı');
    }
  }

  /* ---------- B) YAĞIŞ RADARI ---------- */
  let radarAcik = false, radarZaman = null, radarKareler = null, radarSon = '';
  async function radarDegistir(){
    if(radarAcik){
      clearInterval(radarZaman); radarAcik = false;
      try{ harita.setLayoutProperty('y-radar-kat', 'visibility', 'none'); }catch(e){}
      yaz('radar-acik', false); panelTazele();
      bildir('Yağış radarı kapatıldı.'); return;
    }
    let c;
    try{ c = await (await fetch('/veri/radar')).json(); }
    catch(e){ bildir('Radar verisi alınamadı.'); return; }
    if(!c.kareler || !c.kareler.length){ bildir('Radar kare yok (kaynak boş).'); return; }
    radarKareler = c.kareler;
    const kur = yol => {
      const tiles = [c.host + yol];
      if(!harita.getSource('y-radar')){
        harita.addSource('y-radar', {type:'raster', tiles:tiles, tileSize:256});
        harita.addLayer({id:'y-radar-kat', type:'raster', source:'y-radar',
          paint:{'raster-opacity':.5}}, altKatmanId());
      } else {
        harita.getSource('y-radar').setTiles(tiles);
        harita.setLayoutProperty('y-radar-kat', 'visibility', 'visible');
      }
    };
    let i = radarKareler.length - 1;
    kur(radarKareler[i].yol);
    radarSon = new Date(radarKareler[i].t * 1000).toLocaleTimeString('tr-TR');
    clearInterval(radarZaman);
    radarZaman = setInterval(() => {
      i = (i + 1) % radarKareler.length;
      kur(radarKareler[i].yol);
      radarSon = new Date(radarKareler[i].t * 1000).toLocaleTimeString('tr-TR');
      if(panelEl && panelEl.style.display !== 'none') panelTazele();
    }, 700);
    radarAcik = true; yaz('radar-acik', true); panelTazele();
    bildir('Yağış radarı AÇIK — ' + radarKareler.length + ' kare oynuyor (RainViewer, son 2 saat).');
  }

  /* ---------- C) UYDU FOTOĞRAFI (NASA GIBS) ---------- */
  let uyduAcik = false, uyduTarihDeger = oku('uydu-tarih', '');
  async function uyduDegistir(tarih){
    if(uyduAcik && !tarih){
      uyduAcik = false;
      try{ harita.setLayoutProperty('y-uydu-kat', 'visibility', 'none'); }catch(e){}
      yaz('uydu-acik', false); panelTazele();
      bildir('Uydu fotoğrafı kapatıldı.'); return;
    }
    if(tarih) uyduTarihDeger = tarih;
    let c;
    try{
      c = await (await fetch('/veri/uydu-foto' + (uyduTarihDeger ? '?tarih=' + uyduTarihDeger : ''))).json();
    }catch(e){ bildir('Uydu fotoğrafı bilgisi alınamadı.'); return; }
    uyduTarihDeger = c.tarih; yaz('uydu-tarih', c.tarih);
    const tiles = [c.sablon];
    if(!harita.getSource('y-uydu')){
      harita.addSource('y-uydu', {type:'raster', tiles:tiles, tileSize:256, maxzoom:c.azami_zoom});
      harita.addLayer({id:'y-uydu-kat', type:'raster', source:'y-uydu',
        paint:{'raster-opacity':.85}}, altKatmanId());
    } else {
      harita.getSource('y-uydu').setTiles(tiles);
      harita.setLayoutProperty('y-uydu-kat', 'visibility', 'visible');
    }
    uyduAcik = true; yaz('uydu-acik', true); panelTazele();
    bildir('Uydu fotoğrafı: ' + c.tarih + ' (NASA GIBS · ' + c.katman + ')');
  }

  /* ---------- D) UÇAK İZ KUYRUĞU ---------- */
  const KUYRUK = new Map();
  const IZ_ADIM = 4000, IZ_NOKTA = 16;
  let izAcik = false, izZaman = null, kuyrukZaman = null, etiketAcik = false;

  function izKur(){
    if(harita.getLayer('ucak-iz-cizgi')) return true;
    if(!haritaVar()) return false;
    try{
      harita.addSource('ucak-iz', {type:'geojson', data:{type:'FeatureCollection', features:[]}});
      harita.addLayer({id:'ucak-iz-cizgi', type:'line', source:'ucak-iz', layout:{visibility:'visible'},
        paint:{'line-color':'#2bf0c8','line-opacity':.42,
               'line-width':['interpolate',['linear'],['zoom'],3,1,7,1.8,11,2.6]}});
      return true;
    }catch(e){ return false; }
  }
  function kuyrukTopla(){
    const h = window.gozcuHareket;
    if(!h || !h.noktalar) return 0;
    for(const k of h.noktalar()){
      const p = (k.f && k.f.properties) || {};
      const anahtar = p.h || p.c || (k.la.toFixed(3) + ',' + k.lo.toFixed(3));
      let dizi = KUYRUK.get(anahtar);
      if(!dizi){ dizi = []; KUYRUK.set(anahtar, dizi); }
      const son = dizi[dizi.length - 1];
      if(!son || Math.abs(son[0] - k.lo) > 1e-6 || Math.abs(son[1] - k.la) > 1e-6){
        dizi.push([k.lo, k.la]);
        if(dizi.length > IZ_NOKTA) dizi.shift();
      }
    }
    if(KUYRUK.size > 5000) KUYRUK.clear();
    return KUYRUK.size;
  }
  function izCiz(){
    const fs = [];
    for(const dizi of KUYRUK.values()){
      if(dizi.length < 2) continue;
      fs.push({type:'Feature', properties:{}, geometry:{type:'LineString', coordinates:dizi}});
    }
    try{ harita.getSource('ucak-iz').setData({type:'FeatureCollection', features:fs}); }catch(e){}
    return fs.length;
  }
  function izDegistir(){
    if(izAcik){
      izAcik = false; yaz('iz-acik', false);
      clearInterval(izZaman); clearInterval(kuyrukZaman);
      try{ harita.setLayoutProperty('ucak-iz-cizgi', 'visibility', 'none'); }catch(e){}
      panelTazele(); bildir('Uçak iz kuyruğu kapatıldı.'); return;
    }
    if(!izKur()){ bildir('Harita hazır değil.'); return; }
    izAcik = true; yaz('iz-acik', true);
    harita.setLayoutProperty('ucak-iz-cizgi', 'visibility', 'visible');
    kuyrukTopla(); izCiz(); panelTazele();
    clearInterval(izZaman); clearInterval(kuyrukZaman);
    kuyrukZaman = setInterval(() => { kuyrukTopla(); izCiz(); }, IZ_ADIM);
    bildir('Uçak iz kuyruğu AÇIK — her uçağın arkasında son ~1 dakikalık iz.');
  }

  /* ---------- E) UÇAK ETİKETLERİ ---------- */
  function etiketDegistir(){
    if(etiketAcik){
      etiketAcik = false; yaz('etiket-acik', false);
      try{ harita.setLayoutProperty('ucak-ad-kat', 'visibility', 'none'); }catch(e){}
      panelTazele(); bildir('Uçak etiketleri kapatıldı.'); return;
    }
    try{
      if(!harita.getLayer('ucak-ad-kat')){
        harita.addLayer({id:'ucak-ad-kat', type:'symbol', source:'ucaklar', minzoom:7,
          layout:{visibility:'visible','text-field':['get','c'],'text-size':9.5,
                  'text-offset':[0,-1.15],'text-anchor':'bottom','text-allow-overlap':false},
          paint:{'text-color':'#cfe9ff','text-halo-color':'#04121c','text-halo-width':1.2}});
      } else harita.setLayoutProperty('ucak-ad-kat', 'visibility', 'visible');
      etiketAcik = true; yaz('etiket-acik', true); panelTazele();
      bildir('Uçak etiketleri AÇIK — 7. yakınlaştırmadan sonra çağrı kodları görünür.');
    }catch(e){ bildir('Etiket katmanı kurulamadı: ' + e.message); }
  }

  /* ---------- F) İRTİFA SÜZGECİ ---------- */
  let minIrtifa = oku('min-irtifa', 0);
  function irtifaUygula(){
    const esik = minIrtifa > 0 ? ['>=', ['to-number', ['get','a'], 0], minIrtifa] : null;
    ['ucak-ikon','ucak-yuksek','ucak-orta','ucak-alcak','ucak-canli-ikon','ucak-ad-kat'].forEach(id => {
      try{ harita.setFilter(id, esik); }catch(e){}
    });
  }

  /* ---------- G) KATMAN KUMANDA PANELİ ---------- */
  let panelEl = null, listeEl = null;
  function dugmeSatiri(etiket, secili, tikla, ekBilgi){
    const b = document.createElement('button');
    b.style.cssText = 'display:flex;width:100%;gap:8px;align-items:center;justify-content:space-between;' +
      'background:' + (secili ? 'rgba(43,240,200,.14)' : 'rgba(255,255,255,.03)') + ';' +
      'border:1px solid ' + (secili ? 'var(--vurgu,#2bf0c8)' : 'rgba(255,255,255,.09)') + ';' +
      'border-radius:9px;padding:6px 9px;margin-bottom:5px;color:' + (secili ? '#eafff9' : '#cfe0dc') + ';' +
      'font:12px "Segoe UI",system-ui,sans-serif;cursor:pointer;text-align:left';
    b.innerHTML = '<span>' + etiket + '</span><b style="font-size:11px;opacity:.8">' +
      (ekBilgi || (secili ? 'AÇIK' : 'kapalı')) + '</b>';
    b.onclick = tikla;
    return b;
  }
  function panelTazele(){
    if(!listeEl) return;
    listeEl.innerHTML = '';
    const baslik = document.createElement('div');
    baslik.textContent = 'YENİ KATMANLAR';
    baslik.style.cssText = 'font-size:10.5px;letter-spacing:1.4px;opacity:.55;margin:2px 0 6px';
    listeEl.appendChild(baslik);
    YENI.forEach(k => {
      listeEl.appendChild(dugmeSatiri('• ' + k.ad, !!acik[k.id], () => katmanDegistir(k)));
    });
    const b2 = document.createElement('div');
    b2.textContent = 'KATMANLAR (DİĞER)';
    b2.style.cssText = 'font-size:10.5px;letter-spacing:1.4px;opacity:.55;margin:10px 0 6px';
    listeEl.appendChild(b2);
    listeEl.appendChild(dugmeSatiri('☔ Yağış radarı', radarAcik, () => radarDegistir(),
      radarAcik ? (radarSon || 'AÇIK') : 'kapalı'));
    listeEl.appendChild(dugmeSatiri('🛰 Uydu fotoğrafı', uyduAcik, () => uyduDegistir(),
      uyduAcik ? (uyduTarihDeger || 'AÇIK') : 'kapalı'));
    listeEl.appendChild(dugmeSatiri('➤ Uçak iz kuyruğu', izAcik, () => izDegistir(),
      izAcik ? (KUYRUK.size + ' uçak') : 'kapalı'));
    listeEl.appendChild(dugmeSatiri('🏷 Uçak etiketleri', etiketAcik, () => etiketDegistir()));

    const tarihSatir = document.createElement('div');
    tarihSatir.style.cssText = 'margin:8px 0 4px;font-size:11px;opacity:.8';
    tarihSatir.innerHTML = 'Uydu fotoğrafı tarihi ' +
      '<input id="y-tarih" type="date" value="' + (uyduTarihDeger || '') + '" ' +
      'style="background:#0b1a20;color:#dff3ee;border:1px solid rgba(255,255,255,.15);' +
      'border-radius:6px;padding:3px 5px;font-size:11px">';
    listeEl.appendChild(tarihSatir);
    setTimeout(() => {
      const t = $1('#y-tarih');
      if(t) t.onchange = () => uyduDegistir(t.value);
    }, 0);

    const irt = document.createElement('div');
    irt.style.cssText = 'margin:10px 0 4px;font-size:11px;opacity:.85';
    irt.innerHTML = 'İrtifa süzgeci: <b id="y-irtifa-yazi">' +
      (minIrtifa > 0 ? (minIrtifa + ' ft üzeri') : 'hepsi') + '</b><br>' +
      '<input id="y-irtifa" type="range" min="0" max="40000" step="2500" value="' + minIrtifa + '" ' +
      'style="width:100%;margin-top:5px">';
    listeEl.appendChild(irt);
    setTimeout(() => {
      const s = $1('#y-irtifa');
      if(s) s.oninput = () => {
        minIrtifa = parseInt(s.value, 10) || 0;
        yaz('min-irtifa', minIrtifa);
        const yz = $1('#y-irtifa-yazi');
        if(yz) yz.textContent = minIrtifa > 0 ? (minIrtifa + ' ft üzeri') : 'hepsi';
        irtifaUygula();
      };
    }, 0);

    listeEl.appendChild(dugmeSatiri('🌊 Tsunami uyarıları', false, async () => {
      try{
        const c = await (await fetch('/veri/tsunami')).json();
        const l = c.uyarilar || [];
        bilgiGoster('Tsunami uyarıları (NOAA)',
          l.length ? l.map(x => [x.ad, (x.t || '').slice(0, 16)]) : [['Durum', 'Aktif uyarı yok']]);
      }catch(e){ bildir('Tsunami verisi alınamadı.'); }
    }, 'listele'));

    const kapa = document.createElement('button');
    kapa.textContent = 'Tüm yeni katmanları kapat';
    kapa.style.cssText = 'width:100%;margin-top:9px;background:rgba(255,59,77,.12);color:#ffd7db;' +
      'border:1px solid rgba(255,59,77,.4);border-radius:9px;padding:6px;font:11.5px "Segoe UI";cursor:pointer';
    kapa.onclick = () => {
      YENI.forEach(k => { if(acik[k.id]){ acik[k.id] = false; katmanGoster(k, false); } });
      yaz('yeni-acik', acik); panelTazele(); bildir('Yeni katmanlar kapatıldı.');
    };
    listeEl.appendChild(kapa);
  }
  function panelDegistir(){
    if(!panelEl){
      panelEl = document.createElement('div');
      panelEl.id = 'y-panel';
      panelEl.style.cssText = 'position:fixed;left:16px;bottom:70px;z-index:55;width:268px;max-height:72vh;' +
        'overflow:auto;background:rgba(6,14,18,.96);border:1px solid var(--cizgi,rgba(43,240,200,.28));' +
        'border-radius:14px;padding:12px;color:#dff3ee;font:12.5px/1.5 "Segoe UI",system-ui,sans-serif;' +
        'box-shadow:0 16px 44px -14px #000;display:none';
      panelEl.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
        '<b style="color:var(--vurgu,#2bf0c8);letter-spacing:1.1px;font-size:12px">KATMANLAR · v0.12</b>' +
        '<span id="y-kapat" style="cursor:pointer;opacity:.65">✕</span></div><div id="y-liste"></div>';
      document.body.appendChild(panelEl);
      listeEl = $1('#y-liste');
      $1('#y-kapat').onclick = () => { panelEl.style.display = 'none'; };
    }
    const acilacak = panelEl.style.display === 'none';
    panelEl.style.display = acilacak ? 'block' : 'none';
    if(acilacak) panelTazele();
  }

  /* ---------- DÜĞMELER ---------- */
  function dugme(id, baslik, svg, tikla){
    const b = document.createElement('button');
    b.id = id; b.title = baslik; b.innerHTML = svg; b.onclick = tikla;
    const kap = $1('#sol-alt'); if(kap) kap.appendChild(b);
    return b;
  }
  const SV = {
    katman:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="M2 13l10 5 10-5"/></svg>',
    iz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 18c4 0 6-12 10-12s5 6 8 6"/><circle cx="3" cy="18" r="1.6"/></svg>',
    radar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 12V4"/><path d="M12 12l6 4"/><circle cx="12" cy="12" r="8"/></svg>',
    roket:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2c3 3 4 7 4 11l-4 3-4-3c0-4 1-8 4-11z"/><path d="M8 16l-2 5 4-2M16 16l2 5-4-2"/></svg>',
    mikrofon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
    film:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/></svg>',
    telefon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>',
    hoparlor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>'
  };
  dugme('ek-katman', 'Katman kumanda paneli (yeni katmanlar)', SV.katman, panelDegistir);
  dugme('ek-izkuyruk', 'Uçak iz kuyruğu (son 1 dakikalık sıcak iz)', SV.iz, () => {
    izDegistir(); $1('#ek-izkuyruk').classList.toggle('aktif', izAcik);
  });
  dugme('ek-radar', 'Yağış radarı (canlı, RainViewer)', SV.radar, () => {
    radarDegistir(); setTimeout(() => $1('#ek-radar').classList.toggle('aktif', radarAcik), 900);
  });

  /* ---------- AÇILIŞTA HAZIR OLANLAR ---------- */
  function hazirla(){
    if(!haritaVar()){ setTimeout(hazirla, 700); return; }
    irtifaUygula();
    if(oku('iz-acik', false)) izDegistir();
    if(oku('etiket-acik', false)) etiketDegistir();
    /* kullanıcı daha önce açtığı katmanlar kendiliğinden geri gelir */
    Object.keys(acik).forEach(id => {
      const k = YENI.find(x => x.id === id);
      if(k && acik[id]) katmanDegistir(k);
    });
    if(oku('radar-acik', false)) setTimeout(radarDegistir, 2500);
  }
  if(document.readyState === 'complete') setTimeout(hazirla, 900);
  else window.addEventListener('load', () => setTimeout(hazirla, 900));

  window.gozcuYeni = {katmanDegistir, radarDegistir, izDegistir, etiketDegistir,
                      uyduDegistir, panelDegistir, katmanlar: YENI, durum: () => ({
                        katmanlar: YENI.map(k => [k.id, !!acik[k.id]]),
                        radar: radarAcik, uydu: uyduAcik, iz: izAcik,

        return;
      }

    'yaz':        d => { try{ window.gozcuSes.komutIsle(String(d)); }catch(e){ bildir('Komut anlaşılamadı.'); } }
  };
  async function kumandaTara(){
    try{
      const c = await al('/veri/kumanda');
      const komutlar = c.komutlar || [];
      if(!komutlar.length) return;
      const simdi = Math.floor(Date.now() / 1000);
      let enBuyuk = sonKomutNo, calisan = 0;
      for(const kom of komutlar){
        if(kom.no <= sonKomutNo) continue;
        if(enBuyuk < kom.no) enBuyuk = kom.no;
        /* 2 dakikadan eski komut bayattır: çalıştırılmaz, yalnız temizlenir */
        if(simdi - (kom.t || 0) > 120) continue;

      durum: () => katmanAcikMi(k.kimlik),
      yap: () => panelDegistir(k.kimlik)
    }));
    /* liste boş geldiyse elle */
    if(!t.length){
      [['ucak','Uçaklar'],['gemi','Gemiler'],['uydu','Uydular'],['deprem','Depremler'],
       ['yangin','Yangınlar'],['olay','Doğa olayları'],['hava','Havalimanları'],
       ['kablo','Denizaltı kabloları'],['kamera','Kameralar']].forEach(x => t.push({
        tip:'katman', id:x[0], ad:x[1], adlar:[x[1]],
        durum: () => katmanAcikMi(x[0]),
        yap: () => panelDegistir(x[0])
      }));
    }
    EK_KATMANLAR.forEach(x => {
      /* Panelde zaten varsa yeni hedef açma, ama ek adları ona EKLE
         (ör. panel adı "VIP & kuruluşlar" iken "vip ve kuruluslar" da anlaşılsın) */
      const varOlan = t.find(y => y.id === x.id);
      if(varOlan){
        x.adlar.forEach(a => { if(varOlan.adlar.indexOf(a) < 0) varOlan.adlar.push(a); });
        return;
      }
      t.push({
        tip:'katman', id:x.id, ad:x.adlar[0], adlar:x.adlar,
        durum: () => katmanAcikMi(x.id),
        yap: () => panelDegistir(x.id)
      });
    });
    /* yeni katmanlar (v0.12) */
    try{
      const y = window.gozcuYeni.durum().katmanlar;
      (window.gozcuYeni.katmanlar || []).forEach(k => t.push({
        tip:'yeni', id:k.id, ad:k.ad, adlar:[k.ad],
        durum: () => { const q = window.gozcuYeni.durum().katmanlar.find(x => x[0] === k.id); return !!(q && q[1]); },
        yap: () => window.gozcuYeni.katmanDegistir(k)
      }));
    }catch(e){}
    /* düğmeler */
    for(const id in DUGME_ADLARI){
      if(!$1('#' + id)) continue;
      t.push({tip:'dugme', id:id, ad:DUGME_ADLARI[id][0], adlar:DUGME_ADLARI[id],
        durum: () => { const b = $1('#' + id); return !!(b && b.classList.contains('aktif')); },
        yap: () => { const b = $1('#' + id); if(b) b.click(); }});
    }
    /* bölgeler */
    BOLGELER.forEach(b => t.push({tip:'bolge', id:b.ad, ad:b.ad, adlar:b.adlar,
      yap: () => { try{ harita.fitBounds([[b.k[0], b.k[1]], [b.k[2], b.k[3]]], {duration:1500}); }catch(e){} }}));
    /* temalar ("mor tema", "buz temayı seç") */
    ['turkuaz', 'amber', 'buz', 'mor'].forEach(t2 => t.push({
      tip:'tema', id:'tema-' + t2, ad:t2.replace(/^./, c => c.toLocaleUpperCase('tr')) + ' tema',
      adlar:[t2 + ' tema', 'tema ' + t2],
      durum: () => (document.documentElement.dataset.tema || 'turkuaz') === t2,
      yap: () => { const b = $1('#btn-tema'); if(!b) return; let i = 0;
                   while(i < 8){ b.click(); i++; if((document.documentElement.dataset.tema || 'turkuaz') === t2) break; } }
    }));
    /* özel hedefler (katman panelindeki satırlar) */
    OZEL.forEach(x => { if(x.hazir()) t.push(x.kayit()); });
    return t;
  }

  /* ---------- KOMUT ÇÖZÜMLEME ---------- */
  /* Yakın söyleniş ölçüsü (tanıma hatası: "gemileri kapak" → gemiler) */
  function lev(a, b){
    const m = a.length, n = b.length;
    if(!m) return n;
    if(!n) return m;
    let once = [], simdi = [];
    for(let j = 0; j <= n; j++) once[j] = j;
    for(let i = 1; i <= m; i++){
      simdi[0] = i;
      for(let j = 1; j <= n; j++){
        const bedel = (a[i-1] === b[j-1]) ? 0 : 1;
        simdi[j] = Math.min(simdi[j-1] + 1, once[j] + 1, once[j-1] + bedel);
      }
      const t = once; once = simdi; simdi = t;
    }
    return once[n];
  }
  function benzer(a, b){
    const L = Math.max(a.length, b.length) || 1;
    return 1 - lev(a, b) / L;
  }

  /* Bir katman/düğme adının konuşma varyantları: çoğul ve iyelik ekleri düşer
     ("Uydular" → uydu · "Depremler" → deprem · "Kameralar" → kamera) */
  function varyantlar(ad){
    const n = TUR(ad), set = [n];
    ['lari','leri','larin','lerin','lar','ler','sinin','si','sı','nin','i','u'].forEach(sfx => {
      if(n.endsWith(sfx) && n.length - sfx.length >= 3){
        const k = n.slice(0, -sfx.length);
        if(set.indexOf(k) < 0) set.push(k);
      }
    });
    return set;
  }

  function hedefBul(metin){
    let en = null;
    for(const h of tablo()){
      for(const a of h.adlar){
        for(const n of varyantlar(a)){
          if(n.length < 3) continue;
          if(metin === n || metin.includes(n)){
            const puan = n.length * 10 + (metin === n ? 60 : 0) + (metin.startsWith(n) ? 5 : 0);
            if(!en || puan > en.puan) en = {hedef:h, puan:puan, eslesme:n};
          }
        }
      }
    }
    /* İkinci deneme — konuşma çekimleri ("baltığa git", "akdenize", "türkiyeye") */
    if(!en){
      const mk = katla(metin);
      if(mk){
        for(const h of tablo()){
          for(const a of h.adlar){
            const nk = katla(TUR(a));
            if(nk.length < 4) continue;
            if(mk === nk || mk.includes(nk)){
              const puan = nk.length * 8;
              if(!en || puan > en.puan) en = {hedef:h, puan:puan, eslesme:nk};
            }
          }
        }
      }
    }
    /* Üçüncü deneme — yakın söyleniş: tanıma hatası olsa da doğru hedefi bul
       ("gemileri kapak" → Gemiler · "depremleri kapatın" → Depremler) */
    if(!en){
      const kelimeler = metin.split(' ').filter(k => k.length >= 4);
      let enIyi = 0.79;
      for(const h of tablo()){
        for(const a of h.adlar){
          for(const n of varyantlar(a)){
            if(n.length < 4) continue;
            let s = benzer(metin, n);
            kelimeler.forEach(k => { const b2 = benzer(k, n); if(b2 > s) s = b2; });
            if(s >= enIyi){
              enIyi = s;
              en = {hedef:h, puan: Math.round(s * 100), eslesme:n + ' (~%' + Math.round(s * 100) + ')', yakin: true};
            }
          }
        }
      }
    }
    return en;
  }

  function komutIsle(hamMetin){
    const ham = String(hamMetin || '');
    let m = TUR(ham).replace(/^(hey |tamam | lutfen )+/, '').replace(/^(ustad |gozcu )+/, '')
                   .replace(/\b(lutfen|acaba|hani|sey|simdi|hemen|cabuk|bana|bir)\b/g, ' ')
                   .replace(/\s+/g, ' ').trim();
    if(!m){ return false; }
    const acMi = AC_MI.test(m), kapatMi = KAPAT_MI.test(m);
    durumYaz('🎤 ' + ham);
    bildir('Anlaşılan komut: "' + ham + '"', 3500);

    /* yardım — "paneli aç" da buraya gelir (katman paneli hariç) */
    if(/ne yapabilir|neler yapabilir|komutlar|komut listesi|yardim|nasil kullanilir|yetenek/.test(m) ||
       (/panel(i)? (ac|goster)|paneli ac|panel ac/.test(m) && !/katman/.test(m))){
      yardimGoster(); return true;
    }

    /* toplu */
    if(/hepsini|tumunu|tum katmanlari|herseyi/.test(m)){
      const kapat = kapatMi || /(temizle|gizle)/.test(m);
      let n = 0;
      const kaynak = tablo();
      kaynak.filter(h => h.tip === 'katman' || h.tip === 'yeni').forEach(h => {
        try{ const su = h.durum ? h.durum() : null; if(kapat ? su : !su){ h.yap(); n++; } }catch(e){}
      });
      try{
        if(kapat){ if(window.gozcuYeni.durum().radar) window.gozcuYeni.radarDegistir();
                   if(window.gozcuYeni.durum().iz) window.gozcuYeni.izDegistir();
                   if(window.gozcuYeni.durum().etiket) window.gozcuYeni.etiketDegistir(); }
        else { if(!window.gozcuYeni.durum().radar) window.gozcuYeni.radarDegistir();
               if(!window.gozcuYeni.durum().iz) window.gozcuYeni.izDegistir();
               if(!window.gozcuYeni.durum().etiket) window.gozcuYeni.etiketDegistir();
               n += 3; }
      }catch(e){}
      bildir((kapat ? 'Hepsi kapatıldı: ' : 'Hepsi açıldı: ') + n + ' katman');
      anons(kapat ? 'Tüm katmanlar kapatıldı.' : n + ' katman açıldı.');
      return true;
    }
    /* temizle */
    if(/^(temizle|panelleri kapat|ekrani temizle)/.test(m)){
      ['#y-panel', '#y-zk', '#y-bilgi', '#y-ekran2', '#y-yardim'].forEach(s => {
        const e = $1(s); if(e) e.remove();
      });
      try{ if(window.gozcuCanli && document.body.classList.contains('hko')) window.harekatKapat(); }catch(e){}
      bildir('Paneller kapatıldı.'); anons('Paneller kapatıldı.'); return true;
    }

    const bulunan = hedefBul(m);
    /* Çoklu komut: "uçakları kapat ve gemileri aç" · "mor tema ve limanları aç"
       — metinde ayırıcı varsa ve parçalar FARKLI hedeflere çıkıyorsa hepsini uygula
       ("vip ve kuruluşlar" gibi tek hedefli adlar bölünmesin) */
    {
      const parcalar = m.split(/ ve |,|;| sonra /).map(x => x.trim()).filter(x => x.length > 2);
      if(parcalar.length > 1 && parcalar.length <= 4){
        const kapB = KAPAT_MI.test(m), acB = AC_MI.test(m);
        const fiilli = parcalar.map(x => {
          let q = x;
          if(!AC_MI.test(q) && !KAPAT_MI.test(q)){
            if(kapB) q += ' kapat'; else if(acB) q += ' ac';
          }
          return {soz:q, hedef: hedefBul(q)};
        });
        const farkli = new Set(fiilli.filter(x => x.hedef).map(x => x.hedef.hedef.id));
        if(farkli.size >= 2){
          let n = 0;
          fiilli.forEach(x => { try{ if(komutIsle(x.soz)) n++; }catch(e){} });
          if(n){ bildir(n + ' komut uygulandı.'); anons(n + ' komut uygulandı.'); return true; }
        }
      }
    }
    if(!bulunan){
      anons('Anlayamadım: ' + ham + '. Neler yapabileceğimi duymak için "neler yapabilirsin" deyin.');
      bildir('Anlaşılmadı: "' + ham + '" — yardım için "neler yapabilirsin"', 6000);
      return false;
    }
    const h = bulunan.hedef;
    try{
      if(h.tip === 'katman' || h.tip === 'yeni'){
        const su = h.durum();
        if(acMi && !kapatMi && su){ anons(h.ad + ' zaten açık.'); bildir(h.ad + ' zaten açık.'); return true; }
        if(kapatMi && !acMi && !su){ anons(h.ad + ' zaten kapalı.'); bildir(h.ad + ' zaten kapalı.'); return true; }
        h.yap();
        setTimeout(() => {
          const son = h.durum();
          anons(h.ad + (son ? ' açıldı.' : ' kapatıldı.'));
          bildir(h.ad + (son ? ' AÇILDI' : ' KAPATILDI'));
        }, 700);
        return true;
      }
      if(h.tip === 'tema'){
        if(h.durum()){ anons(h.ad + ' zaten seçili.'); bildir(h.ad + ' zaten seçili.'); return true; }
        h.yap();
        setTimeout(() => { anons(h.ad + ' seçildi.'); bildir(h.ad.toUpperCase() + ' SEÇİLDİ'); }, 900);
        return true;
      }
      if(h.tip === 'dugme'){
        const b = $1('#' + h.id);
        if(!b){ bildir(h.ad + ' düğmesi bulunamadı.'); return false; }
        const oz = DURUM_OZEL[h.id] || null;
        const once = oz ? oz.durum()
                        : (DURUMLU_DUGME.indexOf(h.id) >= 0 ? b.classList.contains('aktif') : null);
        if(once !== null && acMi && !kapatMi && once){
          anons(h.ad + ' zaten açık.'); bildir(h.ad + ' zaten açık.'); return true;
        }
        if(once !== null && kapatMi && !acMi && !once){
          anons(h.ad + ' zaten kapalı.'); bildir(h.ad + ' zaten kapalı.'); return true;
        }
        if(oz){ oz.yap(); } else { b.click(); }
        setTimeout(() => {
          const son = oz ? oz.durum() : b.classList.contains('aktif');
          try{ b.classList.toggle('aktif', !!son); }catch(e){}
          if(once === null && !oz){ bildir(h.ad + ' çalıştırıldı.'); anons(h.ad + ' çalıştırıldı.'); return; }
          anons(h.ad + (son ? ' açıldı.' : ' kapatıldı.'));
          bildir(h.ad + (son ? ' AÇILDI' : ' KAPATILDI'));
        }, 900);
        return true;
      }
      if(h.tip === 'bolge'){
        h.yap();
        /* "gemi bölgesi" derse gemiler de açılsın */
        if(/gemi/.test(m) && !katmanAcikMi('gemi')) panelDegistir('gemi');
        anons(h.ad + ' görünümüne gidiliyor.');
        bildir('Bölge: ' + h.ad + (/gemi/.test(m) ? ' (gemiler açıldı)' : ''));
        return true;
      }
    }catch(e){
      bildir('Komut uygulanamadı: ' + e.message);
      return false;
    }
    return false;
  }

  /* ---------- EKRAN GÖSTERGESİ ---------- */
  let durumEl = null, durumZ = null;
  function durumYaz(metin){
    if(!durumEl){
      durumEl = document.createElement('div');
      durumEl.id = 'y-komut-gosterge';
      durumEl.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:90;' +
        'background:rgba(6,14,18,.94);border:1px solid var(--vurgu,#2bf0c8);border-radius:20px;' +
        'padding:7px 16px;color:#eafff9;font:13px "Segoe UI",system-ui,sans-serif;display:none;' +
        'box-shadow:0 10px 30px -12px #000';
      document.body.appendChild(durumEl);
    }
    durumEl.textContent = metin; durumEl.style.display = 'block';
    clearTimeout(durumZ); durumZ = setTimeout(() => { durumEl.style.display = 'none'; }, 7000);
  }

  /* ---------- YARDIM PENCERESİ ---------- */
  function yardimGoster(){
    let k = $1('#y-yardim');
    if(k){ k.remove(); }
    k = document.createElement('div');
    k.id = 'y-yardim';
    k.style.cssText = 'position:fixed;right:16px;top:70px;z-index:70;width:430px;max-height:78vh;overflow:auto;' +
      'background:rgba(6,14,18,.97);border:1px solid var(--vurgu,#2bf0c8);border-radius:14px;' +
      'padding:14px 16px;color:#dff3ee;font:12.5px/1.55 "Segoe UI",system-ui,sans-serif;' +
      'box-shadow:0 18px 50px -16px #000';
    const kaynak = tablo();
    const gruplar = {katman:'HARİTA KATMANLARI', yeni:'YENİ KATMANLAR (v0.12)',
                     dugme:'ARAÇ DÜĞMELERİ', bolge:'BÖLGELER'};
    let ic = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
      '<b style="color:var(--vurgu,#2bf0c8);letter-spacing:1.2px">🎤 SESLİ KOMUT LİSTESİ · ' +
      kaynak.length + ' hedef</b><span data-k="1" style="cursor:pointer;opacity:.65">✕</span></div>' +
      '<div style="opacity:.75;margin-bottom:10px">Şöyle söyle: <b>"uçakları kapat"</b>, ' +
      '<b>"gemi bölgesi"</b>, <b>"radar aç"</b>, <b>"harekât odası"</b>, ' +
      '<b>"hepsini kapat"</b>, <b>"temizle"</b>.</div>';
    for(const tip in gruplar){
      const liste = kaynak.filter(h => h.tip === tip);
      if(!liste.length) continue;
      ic += '<div style="letter-spacing:1.4px;font-size:10.5px;opacity:.55;margin:10px 0 6px">' +
            gruplar[tip] + ' (' + liste.length + ')</div>';
      ic += '<div style="display:flex;flex-wrap:wrap;gap:5px">';
      liste.forEach(h => { ic += '<span style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);' +
        'border-radius:8px;padding:3px 8px;font-size:11.5px">' + h.ad + '</span>'; });
      ic += '</div>';
    }
    ic += '<div style="margin-top:12px;opacity:.7;font-size:11.5px">Toplu: hepsini aç · hepsini kapat · ' +
          'temizle · "paneli aç" (bu liste). ' +
          (window.gozcuMik && window.gozcuMik.durum().otomatik
            ? 'Mikrofon KENDİLİĞİNDEN dinliyor — durdurmak için "sustur" de.'
            : 'Mikrofon durdurulmuş — "otomatik dinlemeyi aç" ile başlat.') +
          '</div>';
    k.innerHTML = ic;
    k.onclick = e => { if(e.target.dataset.k) k.remove(); };
    document.body.appendChild(k);
    anons('Sesli komut listesi ekranda. Toplam ' + kaynak.length + ' hedef açılabilir.');
    bildir('Komut listesi açıldı — ' + kaynak.length + ' hedef', 6000);
  }

  /* ---------- DİNLEME (v0.13 motorunu devralır) ---------- */
  let dinliyor = false;
  function dinle(){
    if(dinliyor){ bildir('Zaten dinliyorum…'); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ bildir('Bu tarayıcı sesli komutu desteklemiyor (Chrome/Edge gerekir).'); return; }
    const r = new SR();
    r.lang = 'tr-TR'; r.interimResults = false; r.maxAlternatives = 3; r.continuous = false;
    r.onstart = () => { dinliyor = true; durumYaz('🎤 Dinliyorum…'); };
    r.onerror = e => { dinliyor = false;
      bildir('Sesli komut hatası: ' + e.error + (e.error === 'not-allowed' ? ' (mikrofon izni gerekli)' : '')); };
    r.onend = () => { dinliyor = false; };
    r.onresult = e => {
      dinliyor = false;
      const sonuclar = [];
      for(let i = 0; i < e.results[0].length; i++) sonuclar.push(e.results[0][i].transcript);
      for(const s of sonuclar){ if(komutIsle(s)) return; }
      bildir('Hiçbiri anlaşılmadı: ' + sonuclar.join(' | '), 6000);
    };
    try{ r.start(); }catch(e){ dinliyor = false; bildir('Dinleme başlatılamadı: ' + e.message); }
  }

  /* v0.13 motorunu devral */
  try{
    if(window.gozcuCanli){
      window.gozcuCanli.komutDinle = dinle;
      window.gozcuCanli.komutIsle = komutIsle;
      window.gozcuCanli.yardim = yardimGoster;
    }
    const btn = $1('#ek-sesli');
    if(btn){ btn.onclick = dinle; btn.title = 'Sesli komut — tüm sistemi sesle yönet'; }
    const oz = $1('#ek-ozet');
    if(oz){ /* özet düğmesi eskisi gibi kalsın */ }
  }catch(e){}

  window.gozcuSes = {komutIsle, dinle, yardimGoster, tablo, TUR, hedefBul, katla, benzer,
                     durum: () => ({hedefSayisi: tablo().length, dinliyor})};
  console.log('[ÜSTAD GÖZCÜ] v0.14.0 hazır: sesle her şey (' + tablo().length + ' hedef)');
})();
</script>
<script>
/* =====================================================================
   ÜSTAD GÖZCÜ — v0.15.0 — OTOMATİK SESLİ DİNLEME (tuşa basmadan)
   ---------------------------------------------------------------------
   • Panel açılır, mikrofon izni bir kez verilir → mikrofon KENDİLİĞİNDEN dinler.
   • Konuşma bittiğinde tarayıcı dinlemeyi kapatır; biz 0,6 sn sonra
     kendiliğinden yeniden başlatırız → kesintisiz dinleme.
   • KENDİ SESİMİZİ DUYMAZ: panel konuşurken (anons/özet) gelen tanıma yok sayılır.
   • "gözcü" ile başlarsan kelime atılır: "gözcü gemileri kapat".
   • Sesle de yönetilir: "dinlemeyi kapat" · "sustur" · "otomatik dinlemeyi aç".
   • Sağ altta DURUM KUŞAĞI: 🎤 DİNLİYOR / ⏸ DURDU / izin bekliyor — tıklayınca aç/kapa.
   ===================================================================== */
(function(){
  const $1 = s => document.querySelector(s);
  const ON = 'gozcu:';
  const ANAHTAR = ON + 'otomatik-ses';
  /* "gözcü/üstad/hey/tamam" ön ekini at — her aday için ayrı ayrı uygulanır */
  const duzelt = s => String(s || '')
    .replace(/^\s*(hey |tamam )?(gözcü|gozcu|üstad|ustad)\s+/i, '').trim();
  let r = null, calisiyor = false, durduruldu = false, yeniden = null, konusuyor = false;

  function otomatikMi(){
    try{ const v = localStorage.getItem(ANAHTAR); return v === null ? true : v === '1'; }
    catch(e){ return true; }                 /* varsayılan: AÇIK */
  }
  function otomatikYaz(ac){ try{ localStorage.setItem(ANAHTAR, ac ? '1' : '0'); }catch(e){} }

  /* ---------- durum kuşağı ---------- */
  let kusak = null;
  function kusakYap(){
    if(kusak) return kusak;
    kusak = document.createElement('div');
    kusak.id = 'y-mik';
    kusak.style.cssText = 'position:fixed;right:14px;bottom:52px;z-index:88;cursor:pointer;' +
      'display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:20px;' +
      'background:rgba(6,14,18,.92);border:1px solid rgba(43,240,200,.35);color:#dff3ee;' +
      'font:600 11.5px "Segoe UI",system-ui,sans-serif;user-select:none';
    kusak.onclick = () => otomatikDurdur(otomatikMi());
    document.body.appendChild(kusak);
    return kusak;
  }
  let noktaZ = null;
  function kusakYaz(metin, renk){
    const k = kusakYap();
    k.innerHTML = '<span id="y-mik-nokta" style="width:8px;height:8px;border-radius:50%;' +
      'background:' + renk + ';display:inline-block"></span><span>' + metin + '</span>';
    const n = $1('#y-mik-nokta');
    if(n){
      clearInterval(noktaZ);
      if(renk === '#2bf0c8'){           /* dinliyorken nabız gibi atsın */
        let a = 0;
        noktaZ = setInterval(() => { a = a ? 0 : 1; n.style.opacity = a ? '.35' : '1'; }, 900);
      } else { n.style.opacity = '1'; }
    }
  }

  /* ---------- kendi sesimizi duymayalım ---------- */
  setInterval(() => {
    try{ konusuyor = !!(window.speechSynthesis && speechSynthesis.speaking); }catch(e){ konusuyor = false; }
  }, 500);

  function basla(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ kusakYaz('tarayıcı sesi desteklemiyor', '#ff3b4d'); return; }
    if(calisiyor) return;
    try{
      r = new SR();
      r.lang = 'tr-TR';
      r.continuous = true;
      r.interimResults = true;      /* konuşurken canlı yaz */
      r.maxAlternatives = 6;        /* tanıma 6 aday verir; komuta en yakınını seçeriz */
      r.onstart = () => { calisiyor = true; kusakYaz('DİNLİYOR — konuş', '#2bf0c8'); };
      r.onresult = e => {
        /* hem canlı (geçici) hem kesin sonuçları topla */
        let kesin = '', gecici = '';
        for(let i = e.resultIndex || 0; i < e.results.length; i++){
          const res = e.results[i];
          if(!res || res.length === 0) continue;
          if(res.isFinal) kesin += ' ' + res[0].transcript;
          else gecici += ' ' + res[0].transcript;
        }
        kesin = kesin.trim(); gecici = gecici.trim();
        if(gecici && !kesin){
          kusakYaz('duyuyorum: ' + gecici.slice(0, 30), '#3d8bff');
          return;
        }
        if(!kesin) return;
        if(konusuyor) return;                       /* kendi anonsumuzu yorumlamayalım */

        /* dinleme kontrol komutları (motora girmeden) */
        const mk = kesin.toLocaleLowerCase('tr');
        if(/dinlemeyi kapat|dinlemeyi durdur|sustur|mikrofonu kapat/.test(mk)){
          otomatikDurdur(false); return;
        }
        if(/otomatik dinlemeyi ac|otomatik dinleme ac|dinlemeyi ac/.test(mk)){
          otomatikYaz(true); durduruldu = false; basla(); return;
        }

        /* TANIMA 6 ADAY VERİR: komuta en yakın adayı seç (hassasiyet burada) */
        const adaylar = [];
        for(let i = 0; i < e.results.length; i++){
          const res = e.results[i];
          if(!res || !res.isFinal) continue;
          for(let k = 0; k < res.length; k++){
            const x = String(res[k].transcript || '').trim();
            if(x) adaylar.push(x);
          }
        }
        if(!adaylar.length) adaylar.push(kesin);
        let secili = duzelt(adaylar[0]), enPuan = -1;
        adaylar.forEach(x => {
          const y = duzelt(x);
          let p = 0;
          try{
            const h = window.gozcuSes.hedefBul(window.gozcuSes.TUR(y));
            if(h) p = h.puan + (h.yakin ? 0 : 30);
          }catch(err){}
          if(p > enPuan){ enPuan = p; secili = y; }
        });
        if(enPuan < 0) secili = duzelt(kesin);       /* hiçbiri tanınmadıysa ilk aday */
        if(adaylar.length > 1){
          kusakYaz('duydum: ' + secili.slice(0, 30), '#2bf0c8');
          setTimeout(() => kusakYaz('DİNLİYOR — konuş', '#2bf0c8'), 4000);
        }
        if(window.gozcuSes && window.gozcuSes.komutIsle) window.gozcuSes.komutIsle(secili);
      };
      r.onerror = ev => {
        calisiyor = false;
        if(ev && (ev.error === 'not-allowed' || ev.error === 'service-not-allowed')){
          durduruldu = true;
          kusakYaz('mikrofon izni yok — buraya tıkla', '#ffd23b');
        } else if(ev && ev.error === 'audio-capture'){
          durduruldu = true; kusakYaz('mikrofon bulunamadı', '#ff3b4d');
        }
      };
      r.onend = () => {
        calisiyor = false;
        if(!durduruldu && otomatikMi()){
          clearTimeout(yeniden);
          yeniden = setTimeout(basla, 300);          /* kesintisiz dinleme (kısa ara) */
        } else if(durduruldu){ kusakYaz('DURDU — açmak için tıkla', '#ffd23b'); }
      };
      r.start();
      calisiyor = true;
      kusakYaz('DİNLİYOR — konuş', '#2bf0c8');
    }catch(e){
      kusakYaz('dinleme başlatılamadı', '#ff3b4d');
    }
  }

  function otomatikDurdur(ac){
    const a = !!ac;
    otomatikYaz(a);
    durduruldu = !a;
    if(!a){
      clearTimeout(yeniden);
      try{ if(r && r.stop) r.stop(); }catch(e){}
      try{ if(r && r.abort) r.abort(); }catch(e){}
      r = null; calisiyor = false;
      kusakYaz('DURDU — açmak için tıkla', '#ffd23b');
      try{ if(window.gozcuSes && window.gozcuSes.bildir) window.gozcuSes.bildir('Sesli dinleme kapatıldı.'); }catch(e){}
    } else {
      durduruldu = false;
      basla();
      try{ if(window.gozcuSes && window.gozcuSes.bildir) window.gozcuSes.bildir('Sesli dinleme açıldı — tuşa basmadan konuş.'); }catch(e){}
    }
  }

  /* panel hazır olunca kendiliğinden başlat */
  function hazirsa(){
    try{ return !!(window.gozcuSes && window.gozcuSes.komutIsle); }catch(e){ return false; }
  }
  let bekle = setInterval(() => {
    if(hazirsa()){
      clearInterval(bekle);
      kusakYap();
      /* perde kapandıktan sonra dinlemeye başla */
      const gec = Math.max(0, (window.__perdeKapat && window.__perdeKapat.gecen) || 4000);
      setTimeout(() => { if(otomatikMi()) basla(); else kusakYaz('DURDU — açmak için tıkla', '#ffd23b'); }, 1500);
    }
  }, 1000);

  window.gozcuMik = {
    basla, durdur: () => otomatikDurdur(false), ac: () => otomatikDurdur(true),
    durum: () => ({otomatik: otomatikMi(), calisiyor, durduruldu, konusuyor})
  };
  console.log('[ÜSTAD GÖZCÜ] v0.15.0 otomatik sesli dinleme kuruldu');
})();
</script>
