<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÜSTAD GÖZCÜ · canlı dünya haritası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
/* ===========================================================
   ÜSTAD GÖZCÜ — panel görünümü
   Renkler ve düzen ölçülerek alındı; kimlik bize ait.
   =========================================================== */

:root{
  --vurgu:#2bf0c8;
  --vurgu-koyu:#128f76;
  --amber:#ffd23b;
  --alarm:#ff3b4d;
  --bilgi:#3d8bff;
  --zemin:#060c11;
  --zemin-2:#0a1014;
  --panel:rgba(6,14,19,.82);
  --panel-2:rgba(10,22,28,.72);
  --cizgi:rgba(43,240,200,.22);
  --cizgi-soluk:rgba(255,255,255,.09);
  --yazi:#d3dfe6;
  --yazi-soluk:#6f8a90;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ui:"Inter",system-ui,sans-serif;
  --baslik:"Michroma",var(--mono);
}

/* --- tema paletleri --- */
html[data-tema="amber"]  {--vurgu:#ffd23b;--vurgu-koyu:#a37a00;--cizgi:rgba(255,210,59,.22);}
html[data-tema="zumrut"] {--vurgu:#4be3a0;--vurgu-koyu:#1c7d55;--cizgi:rgba(75,227,160,.22);}
html[data-tema="mor"]    {--vurgu:#a98bff;--vurgu-koyu:#5a3fb0;--cizgi:rgba(169,139,255,.24);}
html[data-tema="kirmizi"]{--vurgu:#ff5c7c;--vurgu-koyu:#a02040;--cizgi:rgba(255,92,124,.24);}
html[data-tema="buz"]    {--vurgu:#7fd8ff;--vurgu-koyu:#1f6f96;--cizgi:rgba(127,216,255,.24);}

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--zemin);color:var(--yazi);font-family:var(--ui);overflow:hidden}
#harita{position:fixed;inset:0}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
.kare-btn{
  width:38px;height:38px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--cizgi-soluk);
  border-radius:9px;color:var(--yazi-soluk);backdrop-filter:blur(8px);
  transition:.16s;
}
.kare-btn:hover{color:var(--yazi);border-color:var(--cizgi)}
.kare-btn.aktif{color:var(--vurgu);border-color:var(--cizgi);
  box-shadow:0 0 0 1px rgba(43,240,200,.12), 0 0 14px -3px var(--vurgu);}
.kare-btn.kapali{opacity:.35}
.kare-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- üst sol: marka ---------- */
#marka{position:fixed;top:14px;left:14px;display:flex;align-items:center;gap:13px;z-index:20}
#madalyon{
  width:56px;height:56px;border-radius:50%;object-fit:cover;
  border:2px solid var(--vurgu);box-shadow:0 0 0 3px rgba(43,240,200,.13),0 0 22px -6px var(--vurgu);
  background:var(--zemin-2);
}
#marka .ad{font-family:var(--baslik);font-size:21px;letter-spacing:2.5px;line-height:1;
  color:#eafeff;text-shadow:0 0 18px rgba(43,240,200,.35)}
#marka .slogan{font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;
  color:var(--vurgu);opacity:.85;margin-top:5px}

/* ---------- arama ---------- */
#arama-kutu{position:fixed;top:18px;left:342px;z-index:22;width:266px}
#arama{width:100%;height:38px;padding:0 14px 0 36px;border-radius:9px;
  background:var(--panel);border:1px solid var(--cizgi-soluk);color:var(--yazi);
  font-size:13px;outline:none;backdrop-filter:blur(8px)}
#arama:focus{border-color:var(--cizgi)}
#arama-kutu .buyutec{position:absolute;left:12px;top:10px;width:17px;height:17px;
  stroke:var(--yazi-soluk);fill:none;stroke-width:1.8}
#arama-sonuc{position:absolute;top:44px;left:0;right:0;background:var(--panel);
  border:1px solid var(--cizgi);border-radius:9px;overflow:hidden;display:none;backdrop-filter:blur(10px)}
#arama-sonuc div{padding:9px 12px;font-size:12px;border-bottom:1px solid var(--cizgi-soluk);cursor:pointer}
#arama-sonuc div:last-child{border-bottom:0}
#arama-sonuc div:hover{background:rgba(43,240,200,.08);color:#eafeff}

/* ---------- canlı rozet ---------- */
#canli{position:fixed;top:20px;left:622px;z-index:22;height:34px;padding:0 13px;
  display:flex;align-items:center;gap:8px;border-radius:8px;
  background:var(--panel);border:1px solid var(--cizgi);
  font-family:var(--mono);font-size:11px;letter-spacing:1.4px;color:var(--vurgu)}
#canli .nokta{width:7px;height:7px;border-radius:50%;background:var(--vurgu);
  animation:nabiz 1.6s infinite}
@keyframes nabiz{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--vurgu)}70%{opacity:.45;box-shadow:0 0 0 7px rgba(43,240,200,0)}}

/* ---------- sağ üst: sayaç paneli ---------- */
#sayaclar{position:fixed;top:14px;right:14px;z-index:21;background:var(--panel);
  border:1px solid var(--cizgi-soluk);border-radius:11px;padding:11px 16px 13px;
  backdrop-filter:blur(10px);min-width:430px}
#sayaclar .baslik{font-family:var(--mono);font-size:9.5px;letter-spacing:2.4px;
  color:var(--yazi-soluk);margin-bottom:9px}
.satir{display:grid;grid-template-columns:repeat(3,max-content);gap:7px 26px}
.hucre{display:flex;align-items:center;gap:7px;padding:3px 0}
.hucre svg{width:14px;height:14px;flex:0 0 14px;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.hucre .etiket{font-size:9.5px;color:var(--yazi-soluk);letter-spacing:.3px;line-height:1.15}
.hucre .deger{font-family:var(--mono);font-size:16px;letter-spacing:.5px;line-height:1.1}
.hucre.beklemede .deger{font-size:11px;color:var(--yazi-soluk);font-family:var(--mono)}

/* ---------- sol orta: küçük düğmeler ---------- */
#araclar{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:20;
  display:flex;flex-direction:column;gap:8px}

/* ---------- katman paneli ---------- */
#katman-panel{position:fixed;left:62px;top:50%;transform:translateY(-50%);z-index:21;
  background:var(--panel);border:1px solid var(--cizgi);border-radius:11px;
  padding:12px;width:212px;display:none;backdrop-filter:blur(10px)}
#katman-panel aciklama{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:2px;
  color:var(--yazi-soluk);margin-bottom:10px}
.kat{display:flex;align-items:center;justify-content:space-between;padding:7px 4px;
  font-size:12.5px;border-bottom:1px solid var(--cizgi-soluk)}
.kat:last-child{border-bottom:0}
.kat .sol{display:flex;align-items:center;gap:9px}
.kat .nokta{width:9px;height:9px;border-radius:50%}
.anahtar{width:32px;height:17px;border-radius:9px;background:rgba(255,255,255,.13);
  position:relative;transition:.2s;border:0;flex:0 0 32px}
.anahtar::after{content:"";position:absolute;top:2.5px;left:2.5px;width:12px;height:12px;
  border-radius:50%;background:#8fa5ab;transition:.2s}
.anahtar.acik{background:var(--vurgu-koyu)}
.anahtar.acik::after{left:17.5px;background:var(--vurgu)}

/* ---------- sağ kenar: ikon rayı ---------- */
#ray{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:20;
  display:flex;flex-direction:column;gap:7px}
#ray .kare-btn{width:40px;height:40px;position:relative}
#ray .kare-btn .gelecek{position:absolute;top:5px;right:5px;width:5px;height:5px;
  border-radius:50%;background:var(--amber);opacity:.75}
#ray .ayrac{height:1px;background:var(--cizgi-soluk);margin:3px 6px}

/* ---------- sol alt: yuvarlak dünya + saat ---------- */
#kure-kutu{position:fixed;left:14px;bottom:56px;z-index:20;display:flex;align-items:flex-end;gap:13px}
#kure{width:132px;height:132px;border-radius:50%;
  box-shadow:0 0 0 1px var(--cizgi),0 0 34px -12px var(--vurgu);background:#02070a}
#saat-kutu{font-family:var(--mono);padding-bottom:6px}
#saat{font-size:31px;letter-spacing:1.5px;color:#eafeff;text-shadow:0 0 16px rgba(43,240,200,.28)}
#saat-alt{font-size:10.5px;color:var(--vurgu);letter-spacing:1.6px;margin-top:2px}
#koordinat{font-size:10.5px;color:var(--yazi-soluk);letter-spacing:1px;margin-top:7px}

/* ---------- sağ alt ---------- */
#sag-alt{position:fixed;right:14px;bottom:50px;z-index:20;display:flex;flex-direction:column;gap:8px}

/* ---------- alt şerit ---------- */
#alt-serit{position:fixed;left:0;right:0;bottom:0;height:38px;z-index:19;
  display:flex;align-items:center;gap:18px;padding:0 18px;
  background:linear-gradient(to top,rgba(4,9,12,.92),transparent)}
#alt-serit a{font-family:var(--mono);font-size:10.5px;letter-spacing:1.1px;
  color:var(--yazi-soluk);text-decoration:none}
#alt-serit a:hover{color:var(--vurgu)}
#kaynak-yazi{margin-left:auto;font-family:var(--mono);font-size:10.5px;
  letter-spacing:1.1px;color:var(--yazi-soluk)}

/* ---------- bilgi kutusu (uçak) ---------- */
.bilgi{font-family:var(--mono);font-size:11.5px;line-height:1.65;min-width:190px}
.bilgi b{color:var(--vurgu);font-weight:500}
.bilgi .k{color:var(--yazi-soluk);display:inline-block;min-width:74px}
.maplibregl-popup-content{background:var(--panel);border:1px solid var(--cizgi);
  border-radius:9px;padding:11px 13px;color:var(--yazi);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
.maplibregl-popup-close-button{color:var(--yazi-soluk);font-size:17px;padding:2px 7px}

/* ---------- uyarı ---------- */
#uyari{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;
  max-width:520px;background:var(--panel);border:1px solid var(--alarm);
  border-radius:11px;padding:20px 22px;display:none;backdrop-filter:blur(10px)}
#uyari h3{margin:0 0 9px;font-family:var(--baslik);font-size:14px;color:var(--alarm);letter-spacing:1.5px}
#uyari p{margin:0 0 7px;font-size:13px;line-height:1.6;color:var(--yazi)}
#uyari code{font-family:var(--mono);font-size:12px;color:var(--vurgu);
  background:rgba(43,240,200,.08);padding:1px 6px;border-radius:4px}
/* ---------- ARGOS tarzı: sağ üst kategori çipleri ---------- */
#cipler{position:fixed;top:18px;right:14px;z-index:23;display:flex;gap:7px;align-items:stretch}
.cip{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:7px 10px;border-radius:9px;
  background:var(--panel);border:1px solid var(--cizgi-soluk);cursor:pointer;min-width:82px;
  transition:border-color .15s,background .15s;user-select:none}
.cip:hover{border-color:var(--cizgi);background:var(--panel-2)}
.cip.aktif{border-color:var(--vurgu)}
.cip .c-ad{font:600 10px/1.25 var(--ui);color:var(--yazi);letter-spacing:.2px;white-space:nowrap}
.cip .c-sayi{font:700 12px/1.25 var(--mono);color:var(--vurgu)}
.cip .c-sayi.bos{color:var(--yazi-soluk)}
/* ---------- filtre çekmecesi ---------- */
#filtre-panel{position:fixed;top:74px;right:14px;z-index:25;width:312px;max-height:72vh;overflow:auto;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--cizgi);border-radius:12px;padding:12px 14px;display:none;
  box-shadow:0 18px 44px rgba(0,0,0,.5)}
#filtre-panel h4{margin:0 0 8px;font:700 11px var(--ui);letter-spacing:.8px;color:var(--vurgu);text-transform:uppercase}
#filtre-panel .fbaslik{margin:10px 0 2px;font:700 10px var(--ui);letter-spacing:.6px;color:var(--yazi-soluk)}
/* ---------- filtre çekmecesi: argos tarzı balıkçı düğmeler ---------- */
.fbolum{margin:11px 0 6px;font:700 9.5px var(--ui);letter-spacing:.9px;color:var(--yazi-soluk)}
.fpill-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fpill{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;
  background:rgba(255,255,255,.035);border:1px solid var(--cizgi-soluk);font:500 11px var(--ui);
  color:var(--yazi);overflow:hidden;white-space:nowrap;transition:.13s}
.fpill:hover{border-color:var(--cizgi)}
.fpill .frenk{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.fpill.secili{border-color:var(--vurgu);background:rgba(43,240,200,.12);color:#eafeff}
.fpill .fad{overflow:hidden;text-overflow:ellipsis}
.fsatir{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--cizgi-soluk);font:500 12px var(--ui);color:var(--yazi);cursor:pointer}
.fsatir:last-child{border-bottom:0}
.fsatir:hover{color:#fff}
.fsatir .fsol{display:flex;align-items:center;gap:8px;min-width:0}
.fsatir .fad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsatir .fsayi{font:700 11px var(--mono);color:var(--yazi-soluk)}
.fsatir .fsayi.acik{color:var(--vurgu)}
.fanahtar{width:30px;height:16px;border-radius:9px;background:rgba(255,255,255,.12);position:relative;
  flex:0 0 auto;transition:background .15s}
.fanahtar::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:#cfe6ea;transition:left .15s}
.fanahtar.acik{background:var(--vurgu)}
.fanahtar.acik::after{left:16px;background:#03251d}
.fnot{font:400 10.5px/1.5 var(--ui);color:var(--yazi-soluk);margin-top:8px}
/* piyasa listesi */
.fpiyasa{border:1px solid var(--cizgi-soluk);border-radius:8px;overflow:hidden}
.fprow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
  padding:5px 8px;font:500 11px var(--ui);color:var(--yazi);border-bottom:1px solid var(--cizgi-soluk)}
.fprow:last-child{border-bottom:0}
.fprow:nth-child(odd){background:rgba(255,255,255,.022)}
.fpad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpfiyat{font:600 11px var(--mono);color:#eafeff}
.fpdeg{font:600 10.5px var(--mono);min-width:56px;text-align:right}
/* ---------- sol alt üç düğme ---------- */
#sol-alt{position:fixed;left:16px;bottom:44px;z-index:22;display:flex;gap:8px}
#sol-alt button{width:34px;height:34px;border-radius:8px;background:var(--panel);border:1px solid var(--cizgi-soluk);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--yazi)}
#sol-alt button:hover{border-color:var(--cizgi)}
#sol-alt button.aktif{border-color:var(--vurgu);background:rgba(43,240,200,.1)}
/* ---------- bilgi penceresi (alt şerit bağlantıları) ---------- */
#bilgi-pencere{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(2,7,10,.72);backdrop-filter:blur(3px)}
#bilgi-pencere.acik{display:flex}
#bilgi-pencere .kart{width:min(680px,92vw);max-height:80vh;overflow:auto;background:var(--panel);
  border:1px solid var(--cizgi);border-radius:14px;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
#bilgi-pencere h3{margin:0 0 12px;font:700 13px/1.3 var(--baslik);letter-spacing:1.4px;color:var(--vurgu)}
#bilgi-pencere p{margin:0 0 9px;font:400 13px/1.65 var(--ui);color:var(--yazi)}
#bilgi-pencere .kapat{margin-top:14px;padding:8px 16px;border-radius:8px;cursor:pointer;
  background:rgba(43,240,200,.12);border:1px solid var(--cizgi);color:var(--vurgu);font:600 12px var(--ui)}
</style>
</head>
<body>

<div id="harita"></div>

<!-- ======================= MARKA ======================= -->
<div id="marka" title="Giriş ekranına dön" onclick="location.href='giris.html'" style="cursor:pointer">
  <img id="madalyon" src="foto/ustad-kenan.png" alt="ÜSTAD KENAN KUZUCU">
  <div>
    <div class="ad">ÜSTAD GÖZCÜ</div>
    <div class="slogan">GÖZCÜ HİÇ KIRPMAZ</div>
  </div>
</div>

<!-- ======================= ARAMA ======================= -->
<div id="arama-kutu">
  <svg class="buyutec" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  <input id="arama" type="text" placeholder="yer ara — şehir, ülke, havalimanı…" autocomplete="off">
  <div id="arama-sonuc"></div>
</div>

<div id="canli"><span class="nokta"></span><span id="canli-yazi">CANLI</span></div>

<!-- ======================= SAYAÇLAR ======================= -->
<div id="sayaclar">
  <div class="baslik">KATMANLAR · CANLI SAYIM</div>
  <div class="satir" id="sayac-satir"></div>
</div>

<!-- ======================= SOL ARAÇLAR ======================= -->
<div id="araclar">
  <button class="kare-btn aktif" id="btn-katman" title="Katmanlar">
    <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
  </button>
  <button class="kare-btn" id="btn-tema" title="Tema değiştir">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
  </button>
  <button class="kare-btn" id="btn-ben" title="Beni bul">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="2.4"/></svg>
  </button>
</div>

<!-- ======================= KATMAN PANELİ ======================= -->
<div id="katman-panel">
  <aciklama>KATMANLAR</aciklama>
  <div id="katman-liste"></div>
</div>

<!-- ======================= SAĞ RAY ======================= -->
<div id="ray"></div>

<!-- ARGOS düzeni: sağ üstte kategori çipleri + altında filtre çekmecesi -->
<div id="cipler"></div>
<div id="filtre-panel"></div>

<!-- sol alt: üç araç düğmesi -->
<div id="sol-alt">
  <button id="sol-uydu" title="Uydu görüntüsü katmanı">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round"><path d="M3 21l4.5-4.5M9 15l-3-3M13.5 10.5l-3-3M6 18l3-3M11 8.5l3-3"/>
      <rect x="12" y="3" width="9" height="9" rx="2" transform="rotate(45 16.5 7.5)"/></svg>
  </button>
  <button id="sol-terminator" title="Gece / gündüz sınırı">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
  </button>
  <button id="sol-izle" title="Bu alanı izle">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round"><path d="M3 8V5a2 2 0 012-2h3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M21 16v3a2 2 0 01-2 2h-3"/>
      <circle cx="12" cy="12" r="3"/></svg>
  </button>
</div>

<!-- NOT: alt şerit yukarıda (satır ~327), ikinci kez eklenmedi. -->

<!-- ======================= KÜRE ======================= -->
<div id="kure-kutu">
  <canvas id="kure" width="264" height="264"></canvas>
  <div id="saat-kutu">
    <div id="saat">--:--:--</div>
    <div id="saat-alt">TÜRKİYE · UTC+3</div>
    <div id="koordinat">--.----  --.----</div>
  </div>
</div>

<!-- ======================= SAĞ ALT ======================= -->
<div id="sag-alt">
  <button class="kare-btn" id="btn-arti" title="Yakınlaştır">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="kare-btn" id="btn-eksi" title="Uzaklaştır">
    <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
  </button>
</div>

/* ---------------- harita ---------------- */

const sayi = (ad, varsayilan) => {

try{

/* Kendi yakınlaştırma düğmelerimiz var (sağ alt), MapLibre'nin

/* Bağlantıdan katman seçimi:  ?kat=kablo,olay,gemi   (diğerleri kapanır) */
(function katmanSec(){
  const ham = SORGU.get('kat');
  if(!ham) return;
  const secili = ham.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
  Object.keys(katmanDurum).forEach(k => katmanDurum[k] = secili.indexOf(k) >= 0);

/* ---------------- uçak ikonu (tuval üzerine çizilir) ---------------- */
const UCAK_GOVDE = [
  [0,-16],[1.3,-13],[1.3,-5],[14,2],[14,5],[1.3,.5],[1.3,8],
  [5,11.5],[5,13.5],[0,12],[-5,13.5],[-5,11.5],[-1.3,8],
  [-1.3,.5],[-14,5],[-14,2],[-1.3,-5],[-1.3,-13],
];
function ucakIkonu(renk){
  const boy = 34, t = document.createElement('canvas');
  t.width = t.height = boy;
  const c = t.getContext('2d');
  c.translate(boy/2, boy/2);
  c.beginPath();
  UCAK_GOVDE.forEach(([x,y],i) => i ? c.lineTo(x,y) : c.moveTo(x,y));
  c.closePath();
  c.fillStyle = renk;
  c.fill();
  c.lineWidth = 1.1;
  c.strokeStyle = 'rgba(0,0,0,.55)';
  c.stroke();
  return c.getImageData(0,0,boy,boy);
}

/* gemi silueti — pruva yukarı bakar, rota ile döndürülür */
const GEMI_GOVDE = [
  [0,-15],[2.6,-9],[3.4,-2],[3.4,9],[6.2,13.6],[0,15],[-6.2,13.6],[-3.4,9],
  [-3.4,-2],[-2.6,-9],
];
function gemiIkonu(renk){

  c.beginPath();
  GEMI_GOVDE.forEach(([x,y],i) => i ? c.lineTo(x,y) : c.moveTo(x,y));

  c.lineWidth = 1.1;

/* kamera ikonu — küçük kutu + gövde */
function kameraIkonu(renk){
  const boy = 30, t = document.createElement('canvas');
  t.width = t.height = boy;
  const c = t.getContext('2d');
  c.translate(3, 5);
  c.fillStyle = renk;
  c.strokeStyle = 'rgba(0,0,0,.6)';
  c.lineWidth = 1.1;
  // gövde
  c.beginPath();
  c.roundRect ? c.roundRect(0, 2, 16, 12, 2.2) : c.rect(0, 2, 16, 12);
  c.fill(); c.stroke();
  // objektif
  c.beginPath();
  c.moveTo(17, 5); c.lineTo(24, 2); c.lineTo(24, 14); c.lineTo(17, 11);
  c.closePath(); c.fill(); c.stroke();
  return c.getImageData(0,0,boy,boy);
}

/* ---------------- boş kaynaklar ---------------- */
const BOS = {type:'FeatureCollection', features:[]};

harita.on('load', () => {

  /* --- uçaklar --- */

        'case',

  /* --- gemiler --- */

  /* --- uydular --- */
  harita.addLayer({
    id:'uydu-hale', type:'circle', source:'uydular',

  katmanGorunumleriniUygula();

harita.on('error', e => { /* karo hataları sessiz kalsın */ });

/* ---------------- katman görünürlüğü ---------------- */
function katmanGorunumleriniUygula(){
  const g = v => v ? 'visible' : 'none';
  const koy = (id, acik) => { if(harita.getLayer(id)) harita.setLayoutProperty(id, 'visibility', g(acik)); };
  koy('ucak-ikon',    katmanDurum.ucak);
  koy('gemi-ikon',    katmanDurum.gemi);
  koy('uydu-nokta',   katmanDurum.uydu);
  koy('uydu-hale',    katmanDurum.uydu);
  koy('deprem-nokta', katmanDurum.deprem);
  koy('deprem-hale',  katmanDurum.deprem);
  koy('yangin-nokta', katmanDurum.yangin);
  koy('yangin-hale',  katmanDurum.yangin);
  koy('olay-nokta',   katmanDurum.olay);
  koy('hava-nokta',   katmanDurum.hava);
  koy('kablo-cizgi',  katmanDurum.kablo);
  koy('kamera-ikon-k',katmanDurum.kamera);
  // ARGOS düzeninde eklenen yeni katmanlar
  koy('santral-nokta',katmanDurum.santral);
  koy('bogaz-nokta',  katmanDurum.bogaz);
  koy('bogaz-ad',     katmanDurum.bogaz);
  koy('gdacs-nokta',  katmanDurum.gdacs);
  koy('tahmin-nokta', katmanDurum.tahmin);
  koy('piyasa-nokta', katmanDurum.piyasa);
  koy('piyasa-ad',    katmanDurum.piyasa);
  koy('merkez-nokta', katmanDurum.merkez);
}

/* ---------------- sayaç paneli ---------------- */
let sonSayilar = {ucak:0, deprem:0, hava:0, gemi:0, uydu:0, yangin:0, olay:0, kablo:0, kamera:0};
let ucakEski = false, ucakGeldi = false;
let yanginEski = false, yanginGeldi = false;
let olayEski = false, olayGeldi = false;

/* Sayaç etiketi: veri hiç gelmediyse "veri yok", kaynak düştüyse
   "son bilinen", her şey yolundaysa sade ad. */
function sayacAd(sade, geldi, eski){
  if(!geldi) return sade + ' · veri yok';
  return eski ? sade + ' · son bilinen' : sade;
}
function sayaclariCiz(){
  const hucreler = [
    {ad: sayacAd('UÇAKLAR', ucakGeldi, ucakEski), deger: ucakGeldi ? sonSayilar.ucak : '—', renk:R.vurgu(), ikon:'ucak'},
    {ad:'GEMİLER',       deger:sonSayilar.gemi,   renk:'#5cc8ff', ikon:'gemi'},
    {ad:'UYDULAR',       deger:sonSayilar.uydu,   renk:'#9fe8ff', ikon:'uydu'},
    {ad:'DEPREMLER · 24sa', deger:sonSayilar.deprem, renk:R.alarm, ikon:'deprem'},
    {ad: sayacAd('YANGINLAR', yanginGeldi, yanginEski), deger: yanginGeldi ? sonSayilar.yangin : '—', renk:'#ff8a3d', ikon:'yangin'},
    {ad: sayacAd('DOĞA OLAYLARI', olayGeldi, olayEski), deger: olayGeldi ? sonSayilar.olay : '—', renk:R.amber, ikon:'olay'},
    {ad:'HAVALİMANLARI', deger:sonSayilar.hava,   renk:R.amber,   ikon:'hava'},
    {ad:'DENİZALTI KABLOSU', deger:sonSayilar.kablo, renk:R.mor,  ikon:'kablo'},
    {ad:'KAMERALAR · Londra', deger:sonSayilar.kamera, renk:'#7fd8ff', ikon:'kamera'},
  ];
  const bicim = n => (n || 0).toLocaleString('tr-TR');
  $('#sayac-satir').innerHTML = hucreler.map(h => h.hazir === false
    ? `<div class="hucre beklemede">${svg(IKON[h.ikon], h.renk)}
         <div><div class="etiket">${h.ad}</div><div class="deger">yakında</div></div></div>`
    : `<div class="hucre">${svg(IKON[h.ikon], h.renk)}
         <div><div class="etiket">${h.ad}</div>
         <div class="deger" style="color:${h.renk}">${bicim(h.deger)}</div></div></div>`
  ).join('');
}

/* ---------------- sağ ray ---------------- */
function rayCiz(){
  const oge = [];
  KATMANLAR.forEach(k => {
    oge.push(`<button class="kare-btn ${k.acik?'aktif':''} ${k.hazir?'':'kapali'}"
        data-kat="${k.kimlik}" title="${k.ad}${k.hazir?'':' — yakında'}">
        ${svg(IKON[k.ikon], k.hazir? k.renk : 'var(--yazi-soluk)')}
        ${k.hazir?'':'<span class="gelecek"></span>'}</button>`);
  });
  oge.push('<div class="ayrac"></div>');
  oge.push(`<button class="kare-btn" id="ray-tema" title="Tema">
      ${svg(IKON.tema, R.amber)}</button>`);
  oge.push(`<button class="kare-btn" id="ray-ayar" title="Ayarlar">
      ${svg(IKON.ayar, 'var(--yazi-soluk)')}</button>`);
  $('#ray').innerHTML = oge.join('');

  $('#ray').querySelectorAll('[data-kat]').forEach(b => {
    b.onclick = () => {
      const k = KATMANLAR.find(x => x.kimlik === b.dataset.kat);
      if(!k.hazir){
        kisaBilgi(k.ad + ' katmanı yakında — kaynağı hazırlanıyor.');
        return;
      }
      katmanDurum[k.kimlik] = !katmanDurum[k.kimlik];
      katmanGorunumleriniUygula();
      rayCiz(); katmanPanelCiz();
    };
  });
  $('#ray-tema').onclick = temaDegistir;
  $('#ray-ayar').onclick = ayarPaneli;
}

/* ---------------- katman paneli ---------------- */
function katmanPanelCiz(){
  $('#katman-liste').innerHTML = KATMANLAR.map(k => `
    <div class="kat">
      <div class="sol"><span class="nokta" style="background:${k.renk}"></span>
        <span>${k.ad}</span></div>
      <button class="anahtar ${k.hazir && katmanDurum[k.kimlik] ? 'acik':''}"
              data-kat="${k.kimlik}" ${k.hazir?'':'disabled'}
              style="${k.hazir?'':'opacity:.35'}"></button>
    </div>`).join('');
  $('#katman-liste').querySelectorAll('.anahtar').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.kat;

let ucakYukleniyor = false;
let ucakHizli = null;

async function ucaklariYukle(){
  if(ucakYukleniyor) return;
  // Harita henüz hazır değilse 30 sn bekleme: kısa süre sonra yeniden dene.
  if(!harita.loaded()){
    clearTimeout(ucakHizli);
    ucakHizli = setTimeout(ucaklariYukle, 3000);
    return;
  }
  ucakYukleniyor = true;
  try{
    const c = await (await fetch(`/veri/ucak?b=${gorunurKutu()}&kaynak=${kaynakUcak}`)).json();
    const ucaklar = c.ucaklar || [];
    // Kaynak o an sınırlıysa boş liste gelebilir; ekrandaki uçakları
    // silmeyelim, son bilinen konumlar kalsın.
    if(ucaklar.length === 0 && sonSayilar.ucak > 0){
      ucakYukleniyor = false;
      return;
    }
    // Hiç veri yoksa 30 sn beklemek anlamsız: kaynak cezalı olabilir,
    // 6 sn sonra yeniden dene (gönüllü ağ yorulmasın diye tek deneme).
    if(ucaklar.length === 0){
      ucakYukleniyor = false;
      clearTimeout(ucakHizli);
      ucakHizli = setTimeout(ucaklariYukle, 6000);
      return;
    }
    harita.getSource('ucaklar').setData({
      type:'FeatureCollection',
      features: ucaklar.map(u => ({
          type:'Feature',
          geometry:{type:'Point', coordinates:[u.lo, u.la]},
          properties:u,
        })),
    });
    sonSayilar.ucak = c.sayi;
    // iki kaynak da sınırlıysa sunucu son bilinen konumları gönderir;
    // bunu sayaçta dürüstçe belirt
    ucakEski = (c.eski || 0) > 0;
    if(ucaklar.length > 0) ucakGeldi = true;
    sayaclariCiz();
  }catch(e){ /* sessiz */ }
  ucakYukleniyor = false;
}

function saatCalistir(){

  const iki = n => String(n).padStart(2,'0');
  $('#saat').textContent = `${iki(tr.getHours())}:${iki(tr.getMinutes())}:${iki(tr.getSeconds())}`;
}

/* ---------------- yuvarlak dünya ---------------- */
const kureT = $('#kure');
const kureC = kureT.getContext('2d');
function kureCiz(){
  if(!harita || !harita.loaded()) return;
  const B = kureT.width, r = B/2 - 3, mx = B/2, my = B/2;
  const merkez = harita.getCenter();
  const lat0 = merkez.lat * Math.PI/180, lon0 = merkez.lng * Math.PI/180;

  kureC.clearRect(0,0,B,B);
  kureC.save();
  kureC.beginPath(); kureC.arc(mx,my,r,0,Math.PI*2); kureC.clip();

  // küre zemini
  const gr = kureC.createRadialGradient(mx-r*.3,my-r*.3,r*.1,mx,my,r);
  gr.addColorStop(0,'#0b1a20'); gr.addColorStop(1,'#02070a');
  kureC.fillStyle = gr; kureC.fillRect(0,0,B,B);

  const izd = (latD, lonD) => {
    const la = latD*Math.PI/180, lo = lonD*Math.PI/180 - lon0;
    const cosc = Math.sin(lat0)*Math.sin(la) + Math.cos(lat0)*Math.cos(la)*Math.cos(lo);
    if(cosc <= 0) return null;
    const x = Math.cos(la)*Math.sin(lo);
    const y = Math.cos(lat0)*Math.sin(la) - Math.sin(lat0)*Math.cos(la)*Math.cos(lo);
    return [mx + r*x, my - r*y];
  };

  // ızgara
  kureC.strokeStyle = 'rgba(43,240,200,.13)'; kureC.lineWidth = 1;
  for(let latD=-60; latD<=60; latD+=30){
    kureC.beginPath();
    for(let lonD=-180; lonD<=180; lonD+=4){
      const p = izd(latD,lonD);
      if(!p){ kureC.stroke(); kureC.beginPath(); continue; }
      kureC.lineTo(p[0],p[1]);
    }
    kureC.stroke();
  }
  for(let lonD=-180; lonD<180; lonD+=30){
    kureC.beginPath();
    for(let latD=-88; latD<=88; latD+=3){
      const p = izd(latD,lonD);
      if(!p){ kureC.stroke(); kureC.beginPath(); continue; }
      kureC.lineTo(p[0],p[1]);
    }
    kureC.stroke();
  }

  // gece ışıkları: havalimanları (soluk) — küreye doku verir
  const hs = harita.getSource('havalari');
  if(hs && hs._data && hs._data.features){
    kureC.fillStyle = 'rgba(43,240,200,.30)';
    hs._data.features.forEach((f,i) => {
      if(i % 3) return;
      const p = izd(f.geometry.coordinates[1], f.geometry.coordinates[0]);
      if(!p) return;
      kureC.beginPath(); kureC.arc(p[0],p[1],1.1,0,Math.PI*2); kureC.fill();
    });
  }

  // depremler
  const ds = harita.getSource('depremler');
  if(ds && ds._data && ds._data.features){
    kureC.fillStyle = 'rgba(255,59,77,.9)';
    ds._data.features.forEach(f => {
      const p = izd(f.geometry.coordinates[1], f.geometry.coordinates[0]);
      if(!p) return;
      kureC.beginPath(); kureC.arc(p[0],p[1],2.4,0,Math.PI*2); kureC.fill();
    });
  }

  // uçaklar — en parlak katman
  const us = harita.getSource('ucaklar');
  if(us && us._data && us._data.features){
    kureC.shadowColor = 'rgba(234,254,255,.9)'; kureC.shadowBlur = 5;
    kureC.fillStyle = 'rgba(234,254,255,.95)';
    us._data.features.forEach((f,i) => {
      if(i % 2) return;
      const p = izd(f.geometry.coordinates[1], f.geometry.coordinates[0]);
      if(!p) return;
      kureC.beginPath(); kureC.arc(p[0],p[1],1.6,0,Math.PI*2); kureC.fill();
    });
    kureC.shadowBlur = 0;
  }

  // görünen alan çerçevesi
  const sb = harita.getBounds();
  kureC.strokeStyle = 'rgba(43,240,200,.85)'; kureC.lineWidth = 1.6;
  kureC.beginPath();
  let ilk = true;
  const kose = [[sb.getSouth(),sb.getWest()],[sb.getSouth(),sb.getEast()],
                [sb.getNorth(),sb.getEast()],[sb.getNorth(),sb.getWest()]];
  kose.forEach(([la,lo]) => {
    const p = izd(la,lo);
    if(!p){ ilk = true; return; }
    if(ilk){ kureC.moveTo(p[0],p[1]); ilk = false; } else kureC.lineTo(p[0],p[1]);
  });
  kureC.closePath(); kureC.stroke();

  // merkez işareti
  const mp = izd(merkez.lat, merkez.lng);
  if(mp){
    kureC.fillStyle = '#ffd23b';
    kureC.beginPath(); kureC.arc(mp[0],mp[1],3,0,Math.PI*2); kureC.fill();
  }
  kureC.restore();

  kureC.strokeStyle = 'rgba(43,240,200,.55)'; kureC.lineWidth = 2;
  kureC.beginPath(); kureC.arc(mx,my,r,0,Math.PI*2); kureC.stroke();
}

];
YENI_KAT.forEach(k => {

const YENI_D = {

  gdacs:{geldi:false, yuk:false},    tahmin:{geldi:false, yuk:false},

};

/* --- kaynaklar ve katmanlar (harita hazır olunca) --- */

    harita.addSource('gdacs', {type:'geojson', data:{type:'FeatureCollection', features:[]}});
    harita.addLayer({
      id:'gdacs-nokta', type:'circle', source:'gdacs',
      layout:{visibility:katmanDurum.gdacs?'visible':'none'},
      paint:{
        'circle-radius':['match',['get','seviye'],'red',9,'orange',7,'green',5,6],
        'circle-color':['match',['get','tip'],
          'Tropikal fırtına','#63d2ff','Sel','#3d8bff','Volkan','#ff6b6b',

    harita.addSource('tahminler', {type:'geojson', data:{type:'FeatureCollection', features:[]}});

    harita.addSource('merkezler', {type:'geojson', data:{type:'FeatureCollection', features:[]}});
    harita.addLayer({
      id:'merkez-nokta', type:'circle', source:'merkezler',
      layout:{visibility:katmanDurum.merkez?'visible':'none'},
      paint:{
        'circle-radius':['interpolate',['linear'],['zoom'],2,1.7,6,3.4,10,5.2],
        'circle-color':['match',['get','tip'],
          'şirket merkezi','#ff9ecb','büyükelçilik','#7fe8c8','askerî üs','#ff8a3d','#c9a4ff'],
        'circle-opacity':.86,'circle-stroke-width':.6,'circle-stroke-color':'rgba(6,20,26,.9)',

}
if(harita.loaded()) yeniKatmanlariKur(); else harita.on('load', yeniKatmanlariKur);

/* --- yükleyiciler (tembel: katman ilk açıldığında) --- */
const NOKTA_FC = (liste, yap) => ({type:'FeatureCollection',
  features:(liste||[]).map(x => ({type:'Feature', properties:yap(x),
    geometry:{type:'Point', coordinates:[x.lo, x.la]}}))});

async function santralYukle(){
  if(YENI_D.santral.geldi || YENI_D.santral.yuk) return;
  YENI_D.santral.yuk = true;
  try{
    const c = await (await fetch('/veri/santral')).json();
    harita.getSource('santraller').setData(NOKTA_FC(c.liste, s => ({ad:s.ad, yakit:s.yakit, guc:s.guc, ulke:s.ulke})));
    sonSayilar.santral = c.sayi || 0; YENI_D.santral.geldi = true;
    sayaclariCiz(); cizCipleri(); if(acikKategori!==null) filtreCiz();
  }catch(e){ kisaBilgi('Santral listesi alınamadı.'); }
  YENI_D.santral.yuk = false;
}
async function bogazYukle(){
  if(YENI_D.bogaz.geldi || YENI_D.bogaz.yuk) return;
  YENI_D.bogaz.yuk = true;
  try{
    const c = await (await fetch('/veri/bogaz')).json();
    harita.getSource('bogazlar').setData(NOKTA_FC(c.liste, s => ({ad:s.ad, not:s.not})));
    sonSayilar.bogaz = c.sayi || 0; YENI_D.bogaz.geldi = true;
    sayaclariCiz(); cizCipleri(); if(acikKategori!==null) filtreCiz();
  }catch(e){ kisaBilgi('Boğaz listesi alınamadı.'); }
  YENI_D.bogaz.yuk = false;
}
async function gdacsYukle(){
  if(YENI_D.gdacs.geldi || YENI_D.gdacs.yuk) return;
  YENI_D.gdacs.yuk = true;
  try{
    const c = await (await fetch('/veri/gdacs')).json();
    harita.getSource('gdacs').setData(NOKTA_FC(c.liste, s => ({ad:s.ad, tip:s.tip, seviye:s.seviye, ulke:s.ulke, tarih:s.tarih})));
    sonSayilar.gdacs = c.sayi || 0; YENI_D.gdacs.geldi = true;
    sayaclariCiz(); cizCipleri(); if(acikKategori!==null) filtreCiz();
  }catch(e){ kisaBilgi('Afet uyarıları alınamadı.'); }
  YENI_D.gdacs.yuk = false;
}
async function tahminYukle(){
  if(YENI_D.tahmin.geldi || YENI_D.tahmin.yuk) return;
  YENI_D.tahmin.yuk = true;
  try{
    const c = await (await fetch('/veri/tahmin')).json();
    harita.getSource('tahminler').setData(NOKTA_FC((c.liste||[]).filter(x => x.la || x.lo),
      s => ({ad:s.ad, olasilik:s.olasilik, hacim:s.hacim, url:s.url})));
    sonSayilar.tahmin = c.sayi || 0; YENI_D.tahmin.geldi = true;
    sayaclariCiz(); cizCipleri(); if(acikKategori!==null) filtreCiz();
  }catch(e){ kisaBilgi('Tahmin listesi alınamadı.'); }
  YENI_D.tahmin.yuk = false;
}
async function piyasaYukle(){
  if(YENI_D.piyasa.geldi || YENI_D.piyasa.yuk) return;
  YENI_D.piyasa.yuk = true;
  try{
    const c = await (await fetch('/veri/piyasa')).json();
    YENI_D.piyasa.liste = c.liste || [];
    harita.getSource('piyasa').setData(NOKTA_FC(YENI_D.piyasa.liste, s => ({
      ad:s.ad, sembol:s.sembol, tur:s.tur, fiyat:s.fiyat,
      degisim:(s.degisim === null || s.degisim === undefined) ? 0 : s.degisim,
      sehir:s.sehir, kaynak:s.kaynak})));
    sonSayilar.piyasa = c.sayi || 0; YENI_D.piyasa.geldi = true;
    sayaclariCiz(); cizCipleri(); if(acikKategori!==null) filtreCiz();
    // fiyatlar eskimesin: açıkken 2 dakikada bir tazele
    clearTimeout(YENI_D.piyasa.zaman);
    if(katmanDurum.piyasa) YENI_D.piyasa.zaman = setTimeout(() => {
      YENI_D.piyasa.geldi = false; piyasaYukle();
    }, 120000);
  }catch(e){ kisaBilgi('Piyasa verisi alınamadı.'); }
  YENI_D.piyasa.yuk = false;
}
async function merkezYukle(){
  if(YENI_D.merkez.geldi || YENI_D.merkez.yuk) return;
  YENI_D.merkez.yuk = true;
  try{
    const c = await (await fetch('/veri/merkez')).json();
    harita.getSource('merkezler').setData(NOKTA_FC(c.liste || [],
      s => ({ad:s.ad, tip:s.tip, ulke:s.ulke})));
    sonSayilar.merkez = c.sayi || 0; YENI_D.merkez.geldi = true;
    sayaclariCiz(); cizCipleri(); if(acikKategori!==null) filtreCiz();
    // toplama sürüyorsa 3 dakikada bir tazele (kayıt sayısı büyüyor)
    if(!c.bitti) YENI_D.merkez.zaman = setTimeout(() => {
      YENI_D.merkez.geldi = false; merkezYukle();
    }, 180000);
  }catch(e){ kisaBilgi('VIP & kuruluş verisi alınamadı.'); }
  YENI_D.merkez.yuk = false;
}
const YUKLEYICI = {santral:santralYukle, bogaz:bogazYukle, gdacs:gdacsYukle,
                   tahmin:tahminYukle, piyasa:piyasaYukle, merkez:merkezYukle};

/* --- ortak katman aç/kapa --- */
function katmanDegistir(kimlik){
  katmanDurum[kimlik] = !katmanDurum[kimlik];
  if(katmanDurum[kimlik] && YUKLEYICI[kimlik]) YUKLEYICI[kimlik]();
  katmanGorunumleriniUygula();
  // alt tür süzgeci varsa veri geldikten sonra uygula
  if(ALT_SUZ[kimlik]) setTimeout(() => suzgecUygula(kimlik), 4000);
  rayCiz(); katmanPanelCiz(); cizCipleri();
  if(acikKategori !== null) filtreCiz();
}

/* --- kategori çipleri --- */
const KATEGORILER = [
  {ad:'Kameralar',         kat:['kamera']},
  {ad:'Uçaklar & gemiler', kat:['ucak','gemi']},
  {ad:'Uydular',           kat:['uydu']},
  {ad:'Altyapı',           kat:['hava','santral','kablo','bogaz']},
  {ad:'Olaylar',           kat:['deprem','yangin','olay','gdacs']},
  {ad:'Piyasalar',         kat:['piyasa']},
  {ad:'Tahminler',         kat:['tahmin']},
  {ad:'VIP & kuruluşlar',  kat:['merkez']},
];
let acikKategori = null;

function cizCipleri(){
  const yer = $('#cipler');
  if(!yer) return;
  yer.innerHTML = KATEGORILER.map((k, i) => {
    const toplam = k.kat.reduce((t, x) => t + (Number(sonSayilar[x]) || 0), 0);
    const acik = k.kat.length > 0 && k.kat.every(x => katmanDurum[x]);
    // Henüz açılmamış (tembel yüklenen) katman varsa sayının yanına "…"
    const eksik = k.kat.some(x => YENI_D[x] && !YENI_D[x].geldi && !(Number(sonSayilar[x]) > 0));
    const yazi = k.kat.length
      ? (eksik ? (toplam ? toplam.toLocaleString('tr-TR') + '…' : '—')
               : (toplam ? toplam.toLocaleString('tr-TR') : '0'))
      : '—';
    return `<div class="cip ${acik?'aktif':''}" data-i="${i}" title="${k.not||k.ad}">
      <div class="c-ad">${k.ad}</div>
      <div class="c-sayi ${toplam?'':'bos'}">${yazi}</div></div>`;
  }).join('');
  yer.querySelectorAll('.cip').forEach(c => {
    c.onclick = () => filtreAc(acikKategori === Number(c.dataset.i) ? null : Number(c.dataset.i));
  });
}

/* --- alt tür süzgeçleri (argos'taki balıkçı düğmeleri) --- */
const ALT_SUZ = {
  santral: {bolum:'SANTRAL TÜRÜ', alan:'yakit', katman:'santral-nokta', degerler:[
    ['Nükleer','#ff5c8a'],['Kömür','#8c8f96'],['Doğal gaz','#ffa14a'],['Petrol','#c98a3a'],
    ['Hidroelektrik','#3d8bff'],['Rüzgâr','#7fe8c8'],['Güneş','#ffd23b'],
    ['Jeotermal','#ff7f50'],['Biyokütle','#8fbf5a'],['Atık','#a08a6a']]},
  gdacs: {bolum:'OLAY TÜRÜ', alan:'tip', katman:'gdacs-nokta', degerler:[
    ['Tropikal fırtına','#63d2ff'],['Sel','#3d8bff'],['Volkan','#ff6b6b'],
    ['Orman yangını','#ff8a3d'],['Kuraklık','#c9a44f']]},
  merkez: {bolum:'KURULUŞ TÜRÜ', alan:'tip', katman:'merkez-nokta', degerler:[
    ['şirket merkezi','#ff9ecb'],['büyükelçilik','#7fe8c8'],['askerî üs','#ff8a3d']]},
};
const SUZ_SECILI = {santral:new Set(), gdacs:new Set(), merkez:new Set()};
function suzgecUygula(kimlik){
  const s = ALT_SUZ[kimlik];
  if(!s || !harita.getLayer(s.katman)) return;
  const sec = [...SUZ_SECILI[kimlik]];
  harita.setFilter(s.katman, sec.length ? ['in',['get',s.alan],['literal',sec]] : null);
}

function filtreCiz(){
  const p = $('#filtre-panel');
  if(!p) return;
  if(acikKategori === null){ p.style.display = 'none'; return; }
  const k = KATEGORILER[acikKategori];
  if(!k.kat.length){
    p.innerHTML = `<h4>${k.ad}</h4>
      <div class="fnot">${k.not || 'Kaynak hazırlanıyor'}.</div>
      <div class="fnot">Bu bölüm şirket merkezleri, VIP kişiler ve borsa/ETF/tahvil
      verilerini içeriyor. Hepsi anahtarlı ya da ücretli servislerde olduğu için
      en sona bırakıldı.</div>`;
    p.style.display = 'block';
    return;
  }
  let ic = `<h4>${k.ad}</h4>`;
  k.kat.forEach(x => {
    const kt = KATMANLAR.find(y => y.kimlik === x) || {ad:x, renk:'#2bf0c8'};
    const s = Number(sonSayilar[x]) || 0;
    ic += `<div class="fbolum" style="display:flex;align-items:center;justify-content:space-between">
      <span>${kt.ad.toLocaleUpperCase('tr-TR')}${s ? ' · ' + s.toLocaleString('tr-TR') : ''}</span>
      <span class="fanahtar ${katmanDurum[x]?'acik':''}" data-kat="${x}"></span></div>`;
    const alt = ALT_SUZ[x];
    if(x === 'piyasa' && YENI_D.piyasa.liste.length){
      ic += `<div class="fpiyasa">` + YENI_D.piyasa.liste.map(s => {
        const y = (s.degisim === null || s.degisim === undefined) ? 0 : s.degisim;
        const renk = y >= 0 ? '#4ade80' : '#f87171';
        const okl = y >= 0 ? '▲' : '▼';
        return `<div class="fprow"><span class="fpad">${s.ad}</span>
          <span class="fpfiyat">${Number(s.fiyat).toLocaleString('tr-TR')}</span>
          <span class="fpdeg" style="color:${renk}">${okl} ${Math.abs(y).toFixed(2)}%</span></div>`;
      }).join('') + `</div>
      <div class="fpill-grid" style="margin-top:8px">
        <div class="fpill ${katmanDurum[x]?'secili':''}" data-kat2="${x}">
          <span class="frenk" style="background:#8fe36b"></span>
          <span class="fad">${katmanDurum[x] ? 'Haritada açık' : 'Haritada kapalı'}</span></div></div>
      <div class="fnot">Finnhub (hisse/kripto) + Yahoo (endeks/emtia/döviz/ETF), 2 dakikada bir tazelenir.</div>`;
      return;   // bu katmanın balıkçı düğmesi çizildi, aşağıya inme
    }
    if(alt && YENI_D[x] && YENI_D[x].geldi){
      ic += `<div class="fpill-grid">` + alt.degerler.map(([ad, renk]) =>
        `<div class="fpill ${SUZ_SECILI[x].has(ad)?'secili':''}" data-suz="${x}" data-deger="${ad}">
           <span class="frenk" style="background:${renk}"></span><span class="fad">${ad}</span></div>`).join('') +
        `</div><div class="fnot">Seçim yoksa hepsi gösterilir.</div>`;
    } else {
      ic += `<div class="fpill-grid">

/* --- sol alt 2: gece / gündüz sınırı --- */
let terminatorAcik = false, terminatorZaman = null;
function gecePoligonu(tarih){
  const jd = tarih.getTime() / 86400000 + 2440587.5;
  const n = jd - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360;
  const g = (357.528 + 0.9856003 * n) % 360;
  const lam = L + 1.915 * Math.sin(g * Math.PI / 180) + 0.020 * Math.sin(2 * g * Math.PI / 180);
  const eps = 23.439 - 0.0000004 * n;
  const dek = Math.asin(Math.sin(eps * Math.PI / 180) * Math.sin(lam * Math.PI / 180)) * 180 / Math.PI;
  const gmst = (((18.697374558 + 24.06570982441908 * n) % 24) + 24) % 24;
  const boylam = -15 * (gmst - 12);
  const kenar = [];
  const tanDeg = Math.tan(dek * Math.PI / 180);
  for(let lon = -180; lon <= 180; lon += 2){
    const la = Math.atan(-Math.cos((lon - boylam) * Math.PI / 180) / tanDeg) * 180 / Math.PI;
    kenar.push([lon, la]);
  }
  const kutup = dek > 0 ? -90 : 90;
  return {type:'FeatureCollection', features:[{type:'Feature', properties:{},
    geometry:{type:'Polygon', coordinates:[[[-180, kutup], ...kenar, [180, kutup], [-180, kutup]]]}}]};
}
function terminatorCiz(){
  const kaynak = gecePoligonu(new Date());
  if(!harita.getSource('gece')){
    harita.addSource('gece', {type:'geojson', data:kaynak});
    harita.addLayer({id:'gece-dolgu', type:'fill', source:'gece',
      paint:{'fill-color':'#02070c','fill-opacity':.42}}, ilkVeriKatmani());
  } else {
    harita.getSource('gece').setData(kaynak);
  }
  harita.setLayoutProperty('gece-dolgu', 'visibility', 'visible');
  harita.moveLayer('gece-dolgu', ilkVeriKatmani());
  if(terminatorZaman) clearInterval(terminatorZaman);
  terminatorZaman = setInterval(() => {
    if(!terminatorAcik) return;
    const k = harita.getSource('gece');
    if(k) k.setData(gecePoligonu(new Date()));
  }, 60000);
}
$('#sol-terminator').onclick = () => {
  const calis = () => {
    if(!terminatorAcik){
      terminatorAcik = true; terminatorCiz();
      $('#sol-terminator').classList.add('aktif');
      kisaBilgi('Gece / gündüz sınırı açıldı.');
    } else {
      terminatorAcik = false;
      if(harita.getLayer('gece-dolgu')) harita.setLayoutProperty('gece-dolgu','visibility','none');
      if(terminatorZaman) clearInterval(terminatorZaman);
      $('#sol-terminator').classList.remove('aktif');
      kisaBilgi('Gece / gündüz sınırı kapatıldı.');
    }
  };
  if(harita.loaded()) calis(); else harita.once('load', calis);
};

      if(tur === 'MultiGeometry')
        return `<Placemark><name>${kac(ad)}</name><description>${kac(detay)}</description><MultiGeometry>` +
          koord.map(k => `<LineString><coordinates>${k}</coordinates></LineString>`).join('') + '</MultiGeometry></Placemark>';
      if(!koord) return '';
      const ic = tur === 'Polygon'
        ? `<outerBoundaryIs><LinearRing><coordinates>${koord}</coordinates></LinearRing></outerBoundaryIs>`
        : `<coordinates>${koord}</coordinates>`;
      return `<Placemark><name>${kac(ad)}</name><description>${kac(detay)}</description><${tur}>${ic}</${tur}></Placemark>`;
    }).join('');
    return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">' +
      '<Document><name>ÜSTAD GÖZCÜ</name>' + parca + '</Document></kml>';
  }
  async function disaAktar(katlar, bicim){
    if(typeof katlar === 'string') katlar = katlar.split(',');
    const fs = kaynaklar(katlar);
    if(!fs.length){ toast('Bu katmanda aktarılacak veri yok — katman kapalı olabilir.'); return; }
    const t = new Date();
    const damga = t.getFullYear() + ('0'+(t.getMonth()+1)).slice(-2) + ('0'+t.getDate()).slice(-2) + '-' +
                  ('0'+t.getHours()).slice(-2) + ('0'+t.getMinutes()).slice(-2);
    const ad = 'ustad-gozcu-' + katlar.join('-') + '-' + damga;
    // CSV sayıları nokta ondalıklı, Excel-TR için noktalı virgül ayraç
    if(bicim === 'csv') indir(ad + '.csv', csvOl(fs), 'text/csv;charset=utf-8');
    else if(bicim === 'kml') indir(ad + '.kml', kmlOl(fs), 'application/vnd.google-earth.kml+xml');
    else indir(ad + '.geojson', JSON.stringify({type:'FeatureCollection', features:fs}, null, 1), 'application/geo+json');
    toast(fs.length.toLocaleString('tr-TR') + ' kayıt indirildi (' + bicim.toUpperCase() + ')');
  }
  window.disaAktar = disaAktar;

  /* =================================================================
     2) UYARI + GEOFENCE
     ================================================================= */
  const UY_ANAHTAR = 'ustad-gozcu-uyarilar';
  let uyarilar = [];
  try { uyarilar = JSON.parse(localStorage.getItem(UY_ANAHTAR)) || []; } catch(e){ uyarilar = []; }
  function uyKaydet(){ try { localStorage.setItem(UY_ANAHTAR, JSON.stringify(uyarilar)); } catch(e){} }

  function uyCiz(){
    const kaynak = {type:'FeatureCollection', features: uyarilar.map(u => ({
      type:'Feature', properties:{ad:u.ad},
      geometry:{type:'Polygon', coordinates:[[[u.kutu[0],u.kutu[1]],[u.kutu[2],u.kutu[1]],
                                             [u.kutu[2],u.kutu[3]],[u.kutu[0],u.kutu[3]],
                                             [u.kutu[0],u.kutu[1]]]]}}))};
    const kur = () => {
      if(!harita.getSource('uyari-alan')){
        // harita stili hazır değilken addLayer hata verir: sonra tekrar dene
        try {
          harita.addSource('uyari-alan', {type:'geojson', data:kaynak});
          harita.addLayer({id:'uyari-alan-cizgi', type:'line', source:'uyari-alan',
            paint:{'line-color':'#8fe36b','line-width':1.7,'line-dasharray':[3,2]}});
        } catch(e){ return false; }
      } else {
        harita.getSource('uyari-alan').setData(kaynak);
      }
      return true;
    };
    if(!kur()) harita.once('load', kur);
  }

  function uyEkle(){
    const b = gorunurKutu().split(',').map(Number);
    const ad = 'Alan ' + (uyarilar.length + 1) + ' (' + b[0].toFixed(1) + 'N ' + b[1].toFixed(1) + 'E)';
    uyarilar.push({ad:ad, kutu:b, katlar:['deprem','yangin','olay','ucak','gemi'],
                   kurulus:Date.now(), temel:0, gorulen:{}, olaylar:[]});
    uyKaydet(); uyCiz(); uyListeCiz(); uyTara();
    toast('Uyarı alanı eklendi: ' + ad + ' — içine bir şey girince haber vereceğim.');
    if(window.Notification && Notification.permission === 'default') Notification.requestPermission();
  }

  function uyBildir(u, kat, n){
    const t = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
    u.olaylar = u.olaylar || [];
    u.olaylar.unshift({t:t, kat:kat, ad:n.ad, la:n.la, lo:n.lo});
    u.olaylar = u.olaylar.slice(0, 40);
    if(u.temel) toast('🔔 ' + (ARSIV_AD[kat] || kat) + ': ' + (n.ad || 'kayıt') + ' — ' + u.ad);
    if(u.temel && window.Notification && Notification.permission === 'granted'){
      try { new Notification('ÜSTAD GÖZCÜ — ' + u.ad, {body:(ARSIV_AD[kat] || kat) + ': ' + (n.ad || 'kayıt')}); } catch(e){}
    }
    uyListeCiz(); uyKaydet();
  }

  function uyTara(){
    if(!uyarilar.length) return;
    uyarilar.forEach(u => {
      const b0 = u.kutu[0], b1 = u.kutu[1], b2 = u.kutu[2], b3 = u.kutu[3];
      (u.katlar || []).forEach(kat => {
        noktalar(kat).forEach(n => {
          if(n.la < b1 || n.la > b3 || n.lo < b0 || n.lo > b2) return;
          const h = kat + '|' + n.ad + '|' + (n.la||0).toFixed(2) + (n.lo||0).toFixed(2);
          if(u.gorulen[h]) return;
          u.gorulen[h] = 1;
          uyBildir(u, kat, n);
        });
      });
      // ilk tarama taban çizgisidir: mevcutları "yeni" saymayalım
      const anahtarlar = Object.keys(u.gorulen);
      if(anahtarlar.length > 800) anahtarlar.slice(0, anahtarlar.length - 800).forEach(k => delete u.gorulen[k]);
      if(!u.temel){ u.temel = 1; u.olaylar = []; }
    });
    uyKaydet(); uyListeCiz();
  }

  function uyListeCiz(){
    const yer = $1('#uyari-liste'); if(!yer) return;
    if(!uyarilar.length){ yer.innerHTML = '<h4>UYARILAR</h4><div class="uy-satir">Henüz alan eklenmedi. Haritayı istediğin yere getir, <b>uyarı ekle</b> düğmesine bas.</div>'; return; }
    yer.innerHTML = '<h4>UYARILAR · ' + uyarilar.length + ' ALAN</h4>' + uyarilar.map((u,i) => {
      const ol = (u.olaylar || []).slice(0,6).map(o =>
        `<div class="uy-satir"><span>${kac(o.ad || '-')}<br><small>${kac(ARSIV_AD[o.kat]||o.kat)} · ${o.t}</small></span></div>`).join('');
      return `<div style="margin-bottom:9px">
        <div class="uy-satir"><span><b>${kac(u.ad)}</b></span><button class="uy-sil" data-sil="${i}">sil</button></div>
        ${ol || '<div class="uy-satir"><small>henüz kayıt yok</small></div>'}</div>`;
    }).join('');
    yer.querySelectorAll('.uy-sil').forEach(b => b.onclick = () => {
      uyarilar.splice(Number(b.dataset.sil), 1); uyKaydet(); uyCiz(); uyListeCiz();
    });
  }
  window.uyEkle = uyEkle;

  /* =================================================================
     3) ARŞİV — geçmişe sarma
     ================================================================= */
  let arsivKat = 'ucak', arsivSaatler = [], gecmisMod = false, oynatZaman = null;

  async function arsivSaatleriAl(kat){
    const c = await (await fetch('/veri/arsiv/saatler?kat=' + kat)).json();
    arsivSaatler = c.saatler || [];
    const kaydir = $1('#arsiv-kaydir');
    kaydir.min = '0'; kaydir.max = String(Math.max(0, arsivSaatler.length - 1));
    kaydir.value = String(Math.max(0, arsivSaatler.length - 1));
    arsivZamanCiz();
    return arsivSaatler.length;
  }
  function saatYaz(t){ return new Date(t * 1000).toLocaleString('tr-TR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}); }
  function arsivZamanCiz(){
    const i = Number($1('#arsiv-kaydir').value);
    const s = arsivSaatler[i];
    $1('#arsiv-zaman').textContent = s ? saatYaz(s.t) + ' · ' + s.sayi.toLocaleString('tr-TR') : 'kayıt yok';
    $1('#arsiv-nokta').textContent = arsivSaatler.length ? (i + 1) + '/' + arsivSaatler.length : '0/0';
  }
  async function arsivGit(i){
    if(!arsivSaatler.length) return;
    const s = arsivSaatler[Math.max(0, Math.min(i, arsivSaatler.length - 1))];
    const c = await (await fetch('/veri/arsiv?kat=' + arsivKat + '&t=' + s.t)).json();
    if(!c.liste || !c.liste.length){ toast('Bu zaman için kayıt yok.'); return; }
    harita.getSource(ARSIV[arsivKat]).setData({type:'FeatureCollection', features: c.liste.map(x => ({
      type:'Feature', properties:{ad:x[2], arsiv:1},
      geometry:{type:'Point', coordinates:[x[1], x[0]]}}))});
    gecmisMod = true;
    const rz = $1('#gecmis-rozet');
    rz.textContent = 'GEÇMİŞ · ' + saatYaz(s.t) + ' · ' + ARSIV_AD[arsivKat];
    rz.classList.add('acik');
  }
  function canliyaDon(){
    clearInterval(oynatZaman); oynatZaman = null;
    gecmisMod = false; $1('#gecmis-rozet').classList.remove('acik');
    $1('#arsiv-oynat').textContent = '▶ Oynat';
    if(CANLI_YUK[arsivKat]) CANLI_YUK[arsivKat]();
    toast('Canlı yayına dönüldü.');
  }
  window.arsivGit = arsivGit; window.canliyaDon = canliyaDon;

  /* =================================================================
     4) VİDEO DUVARI + TV MODU
     ================================================================= */
  let kameralar = null;
  async function kameraAl(){
    if(kameralar) return kameralar;
    const c = await (await fetch('/veri/kamera')).json();
    kameralar = c.kameralar || [];
    return kameralar;
  }
  async function videoDuvar(){
    const k = await kameraAl();
    if(!k.length){ toast('Kamera verisi yok.'); return; }
    const m = harita.getCenter();
    const yakin = k.map(x => ({x:x, d:(x.la-m.lat)**2 + (x.lo-m.lng)**2}))
                   .sort((a,b) => a.d - b.d).slice(0, 16).map(o => o.x);
    const vd = $1('#vd');
    vd.innerHTML = '<div class="vd-ust"><span>VİDEO DUVARI · en yakın 16 kamera · ' +
      (kameralar.length) + ' kamera içinde</span><span>' +
      '<button id="vd-kapat" style="background:#0e161c;color:#eaf6f2;border:1px solid #2a3a44;' +
      'border-radius:7px;padding:5px 11px;cursor:pointer;font:600 11px var(--ui)">KAPAT ✕</button></span></div>' +
      '<div class="vd-izgara">' + yakin.map(x =>
        `<div class="vd-kutu" data-g="${x.gorsel}" data-v="${x.video}" data-ad="${kac(x.ad)}">
           <img loading="lazy" src="${x.gorsel}" alt=""><span>${kac(x.ad)}</span></div>`).join('') + '</div>' +
      '<div style="margin-top:10px;color:var(--yazi-soluk);font:500 11px var(--ui)">' +
      'Bir kareye tıkla: canlı video açılır. Kaynak: Transport for London JamCams (resmî açık veri).</div>';
    vd.classList.add('acik');
    $1('#vd-kapat').onclick = () => vd.classList.remove('acik');
    vd.querySelectorAll('.vd-kutu').forEach(kare => kare.onclick = () => {
      const v = document.createElement('video');
      v.src = kare.dataset.v; v.autoplay = true; v.muted = true; v.loop = true; v.controls = true;
      v.setAttribute('playsinline','');
      kare.innerHTML = ''; kare.appendChild(v);
      const s = document.createElement('span'); s.textContent = kare.dataset.ad + ' · canlı video';
      kare.appendChild(s);
    });
  }
  function tvModu(){
    const tv = $1('#tv');
    if(tv.classList.contains('acik')){ tv.classList.remove('acik'); document.body.classList.remove('tv');
      if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); return; }
    tv.classList.add('acik'); document.body.classList.add('tv');
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    tvYaz();
    if(!window.__tvZaman) window.__tvZaman = setInterval(tvYaz, 1000);
  }
  function tvYaz(){
    const tv = $1('#tv'); if(!tv) return;
    const t = new Date();
    const s = KATEGORILER.map(k => {
      const top = k.kat.reduce((a,x) => a + (Number(sonSayilar[x]) || 0), 0);
      return '<div>' + kac(k.ad) + '<b>' + (top ? top.toLocaleString('tr-TR') : '—') + '</b></div>';
    }).join('');
    tv.innerHTML = '<div class="tv-baslik">ÜSTAD GÖZCÜ · CANLI DÜNYA MONİTÖRÜ</div>' +
      '<div class="tv-saat">' + t.toLocaleTimeString('tr-TR') + '<span style="font-size:22px;color:#5e7a86"> ' +
      t.toLocaleDateString('tr-TR', {day:'2-digit', month:'long', weekday:'long'}) + '</span></div>' +
      '<div class="tv-alt">' + s + '</div>' +
      '<div style="color:#41616e;font:500 12px var(--ui)">Çıkmak için ESC ya da TV düğmesi · katman sayıları canlı</div>';
  }
  window.videoDuvar = videoDuvar; window.tvModu = tvModu;

  /* =================================================================
     ARAYÜZ: sol alt düğmeler + arşiv şeridi + uyarı listesi
     ================================================================= */
  function dugmeEkle(id, baslik, svg, tikla){
    const b = document.createElement('button');
    b.id = id; b.title = baslik; b.innerHTML = svg;
    b.onclick = tikla;
    $1('#sol-alt').appendChild(b);
    return b;
  }
  const SV = {
    arsiv:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/><path d="M3 4v4h4"/></svg>',
    uyari:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17h.01"/></svg>',
    uyliste:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h9"/><circle cx="19" cy="18" r="2.4"/></svg>',
    vd:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="8" height="6" rx="1"/><rect x="13" y="4" width="8" height="6" rx="1"/><rect x="3" y="14" width="8" height="6" rx="1"/><rect x="13" y="14" width="8" height="6" rx="1"/></svg>',
    tv:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg>'
  };
  const arsivBar = document.createElement('div');
  arsivBar.id = 'arsiv-bar';
  arsivBar.innerHTML =
    '<span style="color:#7fe8c8;font:600 10.5px var(--mono);letter-spacing:.08em">ARŞİV</span>' +
    '<select id="arsiv-kat">' + Object.keys(ARSIV).map(k => `<option value="${k}">${ARSIV_AD[k]}</option>`).join('') + '</select>' +
    '<button id="arsiv-geri" title="Bir adım geri">◀</button>' +
    '<input type="range" id="arsiv-kaydir" min="0" max="0" value="0">' +
    '<button id="arsiv-ileri" title="Bir adım ileri">▶</button>' +
    '<button id="arsiv-oynat" title="Geçmişi oynat">▶ Oynat</button>' +
    '<span id="arsiv-zaman">kayıt yok</span>' +
    '<span id="arsiv-nokta" style="color:var(--yazi-soluk);font:500 10px var(--mono)">0/0</span>' +
    '<button id="arsiv-canli" title="Canlı yayına dön">CANLI</button>';
  document.body.appendChild(arsivBar);
  const rozet = document.createElement('div');
  rozet.id = 'gecmis-rozet'; document.body.appendChild(rozet);
  const uyListe = document.createElement('div');
  uyListe.id = 'uyari-liste'; document.body.appendChild(uyListe);
  const vdKutu = document.createElement('div');
  vdKutu.id = 'vd'; document.body.appendChild(vdKutu);
  const tvKutu = document.createElement('div');
  tvKutu.id = 'tv'; document.body.appendChild(tvKutu);

  dugmeEkle('ek-arsiv', 'Arşiv: son 72 saate sar', SV.arsiv, async () => {
    const bar = $1('#arsiv-bar');
    bar.classList.toggle('acik');
    $1('#ek-arsiv').classList.toggle('aktif', bar.classList.contains('acik'));
    if(bar.classList.contains('acik')){
      const n = await arsivSaatleriAl(arsivKat);
      if(!n) toast('Arşivde henüz kayıt yok — sunucu kayıt topluyor (2 dakikada bir).');
    }
  });
  dugmeEkle('ek-uyari', 'Bu alanı izle: uyarı ekle', SV.uyari, uyEkle);
  dugmeEkle('ek-uyliste', 'Uyarı listesi', SV.uyliste, () => {
    $1('#uyari-liste').classList.toggle('acik'); uyListeCiz();
  });
  dugmeEkle('ek-vd', 'Video duvarı (16 kamera)', SV.vd, videoDuvar);
  dugmeEkle('ek-tv', 'TV modu (kontrol odası)', SV.tv, tvModu);

  $1('#arsiv-kat').onchange = async e => {
    arsivKat = e.target.value;
    if(gecmisMod) canliyaDon();
    const n = await arsivSaatleriAl(arsivKat);
    if(n) await arsivGit(n - 1);
    else toast(ARSIV_AD[arsivKat] + ' için henüz kayıt yok.');
  };
  $1('#arsiv-kaydir').oninput = e => { if(oynatZaman){ clearInterval(oynatZaman); oynatZaman = null; $1('#arsiv-oynat').textContent = '▶ Oynat'; } arsivZamanCiz(); arsivGit(Number(e.target.value)); };
  $1('#arsiv-geri').onclick = () => { const k = $1('#arsiv-kaydir'); k.value = String(Math.max(0, Number(k.value) - 1)); k.oninput({target:k}); };
  $1('#arsiv-ileri').onclick = () => { const k = $1('#arsiv-kaydir'); k.value = String(Math.min(arsivSaatler.length - 1, Number(k.value) + 1)); k.oninput({target:k}); };
  $1('#arsiv-canli').onclick = canliyaDon;
  $1('#arsiv-oynat').onclick = () => {
    if(oynatZaman){ clearInterval(oynatZaman); oynatZaman = null; $1('#arsiv-oynat').textContent = '▶ Oynat'; return; }
    if(arsivSaatler.length < 2){ toast('Oynatmak için en az iki kayıt gerekir.'); return; }
    $1('#arsiv-oynat').textContent = '❚❚ Dur';
    let i = Number($1('#arsiv-kaydir').value);
    oynatZaman = setInterval(() => {
      i = i + 1;
      if(i >= arsivSaatler.length){ i = 0; }
      $1('#arsiv-kaydir').value = String(i); arsivZamanCiz(); arsivGit(i);
    }, 900);
  };
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ $1('#vd').classList.remove('acik'); $1('#tv').classList.remove('acik'); document.body.classList.remove('tv'); }
  });

  /* çekmeceye "indir" düğmeleri: her bölümün altına CSV / KML / GeoJSON */
  function disaDugmeleri(){
    const yer = $1('#filtre-panel'); if(!yer) return;
    /* çekmecede bölüm başlığı (.fbolum) ile balıkçı düğmeleri (.fpill-grid)
       ayrı kardeş öğeler; indir satırını düğme ızgarasının ALTINA koy */
    yer.querySelectorAll('.fpill-grid').forEach(grid => {
      const sonraki = grid.nextElementSibling;
      if(sonraki && sonraki.classList && sonraki.classList.contains('fdisa')) return;
      const katlar = [...new Set([...grid.querySelectorAll('[data-kat2]')].map(p => p.dataset.kat2))];
      if(!katlar.length) return;
      const kap = document.createElement('div');
      kap.className = 'fdisa';
      kap.innerHTML = `<button data-bicim="csv" data-kats="${katlar.join(',')}">CSV</button>` +
                      `<button data-bicim="kml" data-kats="${katlar.join(',')}">KML (Earth)</button>` +
                      `<button data-bicim="geojson" data-kats="${katlar.join(',')}">GeoJSON</button>`;
      kap.querySelectorAll('button').forEach(b => b.onclick = ev => {
        ev.stopPropagation(); disaAktar(b.dataset.kats, b.dataset.bicim);
      });
      grid.insertAdjacentElement('afterend', kap);
    });
  }
  new MutationObserver(disaDugmeleri).observe(document.body, {childList:true, subtree:true});
  setTimeout(disaDugmeleri, 3000);

  /* döngüler */
  uyCiz(); uyListeCiz();
  setInterval(uyTara, 20000);
  setTimeout(uyTara, 6000);
  console.log('[ÜSTAD GÖZCÜ] ek araçlar hazır: arşiv, uyarı, dışa aktarma, video duvarı, TV modu');
})();
</script>
<script>
/* =====================================================================
   ÜSTAD GÖZCÜ — HAREKÂT ODASI (v0.7.0)
   Askerî şura / harekât odası görünümü: köşe kelepçeleri, tarama
   çizgileri, radar (canlı blipller), gezinti (dünyayı kendi gezer),
   alt bantta akan durum yazısı. Aç/kapa animasyonlu.
   ===================================================================== */
(function(){
  if(window.__harekat) return; window.__harekat = true;
  const $1 = s => document.querySelector(s);
  const kac = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

  /* ---------- stil ---------- */
  const st = document.createElement('style');
  st.textContent = `
  #ek-hko.on{border-color:#8fe36b;background:rgba(143,227,107,.14)}
  #hko{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;transform:scale(1.03);
    transition:opacity .55s ease, transform .55s ease}
  #hko.acik{opacity:1;transform:none}
  #hko .kose{position:absolute;width:64px;height:64px;border:2px solid rgba(143,227,107,.55)}
  #hko .kose.sol-ust{left:12px;top:12px;border-right:0;border-bottom:0}
  #hko .kose.sag-ust{right:12px;top:12px;border-left:0;border-bottom:0}
  #hko .kose.sol-alt{left:12px;bottom:12px;border-right:0;border-top:0}
  #hko .kose.sag-alt{right:12px;bottom:12px;border-left:0;border-top:0}
  #hko .tarama{position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(143,227,107,.045) 0 1px,transparent 1px 4px);

  /* oda açıkken normal arayüz çekilir; harita ve sol alt düğmeler kalır */

  `;
  document.head.appendChild(st);

  const hko = document.createElement('div');
  hko.id = 'hko';
  hko.innerHTML =
    '<div class="tarama"></div>' +
    '<div class="kose sol-ust"></div><div class="kose sag-ust"></div>' +
    '<div class="kose sol-alt"></div><div class="kose sag-alt"></div>' +
    '<div class="hko-ust"><div class="b">HAREKÂT ODASI</div>' +
      '<div class="s">ÜSTAD GÖZCÜ · CANLI DURUM · <span id="hko-saat">--:--:--</span></div></div>' +
    '<div class="hko-yer" id="hko-yer">TÜRKİYE</div>' +
    '<div class="hko-sol" id="hko-sol"></div>' +
    '<div class="hko-sag sag" id="hko-sag"></div>' +

  document.body.appendChild(hko);

  /* ---------- gezinti: gözcü kendi gezer ---------- */
  const GEZI = [
    ['TÜRKİYE', 39.0, 35.0, 5.2], ['EGE & BALKANLAR', 39.5, 25.0, 6],
    ['DOĞU AKDENİZ', 34.5, 33.0, 6], ['KAFKASYA', 42.0, 45.0, 6],
    ['ORTA DOĞU', 30.0, 45.0, 5], ['ORTA ASYA', 42.0, 68.0, 5],
    ['BALTIK', 57.0, 20.0, 5.5], ['KUZEY AVRUPA', 55.0, 10.0, 5],
    ['ATLAS OKYANUSU', 40.0, -30.0, 4], ['KUZEY AMERİKA', 39.0, -95.0, 4],
    ['PASİFİK', 20.0, 150.0, 3.5], ['GÜNEY AMERİKA', -15.0, -60.0, 4],
    ['AFRİKA', 0.0, 20.0, 4], ['HİNDİSTAN', 20.0, 78.0, 5],
    ['AVUSTRALYA', -25.0, 134.0, 4], ['KUZEY KUTBU', 70.0, 0.0, 3],
  ];
  let gezi = 0, geziZaman = null, radarZaman = null;

  function geziAdim(){
    const g = GEZI[gezi % GEZI.length]; gezi++;
    const el = $1('#hko-yer'); if(el) el.textContent = g[0];
    try {
      harita.flyTo({center:[g[2], g[1]], zoom:g[3], duration:9000, curve:1.5, essential:true});
    } catch(e){}
  }

  /* ---------- radar: gerçek noktalardan blip ---------- */
  let bliplar = [];
  const KAYNAK_RENK = {ucaklar:'#8fe36b', gemiler:'#7fd8ff', depremler:'#ff8a3d', yanginlar:'#ff6b6b'};
  function blipTopla(){
    try {
      const m = harita.getCenter(), b = gorunurKutu().split(',').map(Number);
      /* b = güney,batı,kuzey,doğu → spanX boylam, spanY enlem yarı-açıklığı */
      const spanX = Math.max(0.5, (b[3] - b[1]) / 2), spanY = Math.max(0.5, (b[2] - b[0]) / 2);
      const yeni = [];
      Object.keys(KAYNAK_RENK).forEach(sid => {
        const s = harita.getSource(sid); const d = s && s._data;
        if(!d || !d.features) return;
        for(const f of d.features){
          const g = f.geometry; if(!g || g.type !== 'Point') continue;
          const x = (g.coordinates[0] - m.lng) / spanX, y = -(g.coordinates[1] - m.lat) / spanY;
          if(x*x + y*y > 1) continue;
          yeni.push({x:x, y:y, renk:KAYNAK_RENK[sid]});
          if(yeni.length > 420) break;
        }
      });
      bliplar = yeni;
    } catch(e){}
  }
  function radarCiz(){
    const c = $1('#hko-radar'); if(!c) return;
    const g = c.getContext('2d'), W = c.width, H = c.height, R = Math.min(W,H)/2 - 10;
    g.clearRect(0,0,W,H);
    g.strokeStyle = 'rgba(143,227,107,.30)'; g.lineWidth = 1.4;
    [0.34, 0.67, 1].forEach(f => { g.beginPath(); g.arc(W/2,H/2,R*f,0,Math.PI*2); g.stroke(); });
    g.beginPath(); g.moveTo(W/2-R,H/2); g.lineTo(W/2+R,H/2);
    g.moveTo(W/2,H/2-R); g.lineTo(W/2,H/2+R); g.stroke();
    bliplar.forEach(b => {
      g.fillStyle = b.renk; g.globalAlpha = .85;
      g.beginPath(); g.arc(W/2 + b.x*R, H/2 + b.y*R, 3, 0, Math.PI*2); g.fill();
    });
    g.globalAlpha = 1;
    const a = ((Date.now()/1000) % 3.6) / 3.6 * Math.PI * 2;
    const grd = g.createLinearGradient(W/2, H/2, W/2 + Math.cos(a)*R, H/2 + Math.sin(a)*R);
    grd.addColorStop(0, 'rgba(143,227,107,0)'); grd.addColorStop(1, 'rgba(143,227,107,.55)');
    g.strokeStyle = grd; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(W/2,H/2); g.lineTo(W/2 + Math.cos(a)*R, H/2 + Math.sin(a)*R); g.stroke();
    g.fillStyle = 'rgba(143,227,107,.9)';
    g.beginPath(); g.arc(W/2,H/2,3.4,0,Math.PI*2); g.fill();
    const bl = bliplar.length;
    g.fillStyle = 'rgba(203,245,184,.75)'; g.font = '600 20px monospace';
    g.fillText(bl + ' TEMAS', 12, 26);
  }

  /* ---------- panolar ---------- */
  function topla(kat){ return Number(sonSayilar[kat]) || 0; }
  function panolariYaz(){
    const sol = [
      ['UÇAK', topla('ucak')], ['GEMİ', topla('gemi')], ['UYDU', topla('uydu')],
      ['DEPREM', topla('deprem')], ['YANGIN', topla('yangin')],
    ];
    const sag = [
      ['KAMERA', topla('kamera')], ['SANTAL', topla('santral')], ['AFET', topla('gdacs')],
      ['KURULUŞ', topla('merkez')], ['PİYASA', topla('piyasa')],
    ];
    const satir = (a) => a.map(x => `<div class="satir"><span>${x[0]}</span><b>${x[1] ? x[1].toLocaleString('tr-TR') : '—'}</b></div>`).join('');
    const el1 = $1('#hko-sol'), el2 = $1('#hko-sag');
    if(el1) el1.innerHTML = satir(sol);
    if(el2) el2.innerHTML = satir(sag);
    const cz = $1('#hko-cizgi');
    if(cz) cz.innerHTML =
      '<div>TEHDİT SEVİYESİ</div><div class="bar"><i></i></div>' +
      '<div style="margin-top:8px">İZLENEN ALAN: ' +
      (JSON.parse(localStorage.getItem('ustad-gozcu-uyarilar') || '[]').length) + ' bölge</div>' +
      '<div>ARŞİV: son 72 saat · 2 dk aralık</div>' +
      '<div>KONUM: ' + harita.getCenter().lat.toFixed(2) + 'N ' + harita.getCenter().lng.toFixed(2) + 'E' +
      ' · ZOOM ' + harita.getZoom().toFixed(1) + '</div>';
    const b = $1('#hko-bant-yazi');
    if(b) b.textContent = '◄ HAREKÂT ODASI ►   ' + sol.concat(sag).map(x => x[0] + ' ' +
      (x[1] ? x[1].toLocaleString('tr-TR') : '—')).join('   ·   ') +
      '   ◄ KAYNAKLAR: OpenSky · Digitraffic · USGS · NASA EONET · GDACS · WRI · TfL · Wikidata · OSM ►' +
      '   ◄ GÖZCÜ HİÇ KIRPMAZ ►';
  }

  function tik(){
    const s = $1('#hko-saat');
    if(s) s.textContent = new Date().toLocaleTimeString('tr-TR');
  }

  function ac(){
    hko.classList.add('acik'); document.body.classList.add('hko');
    try { if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); } catch(e){}
    $1('#ek-hko').classList.add('on');
    gezi = 0; geziAdim();
    clearInterval(geziZaman); geziZaman = setInterval(geziAdim, 12000);
    clearInterval(radarZaman);
    radarZaman = setInterval(() => { blipTopla(); panolariYaz(); tik(); }, 1000);
    blipTopla(); panolariYaz(); tik();
    // odada bütün sayaçlar dolu olsun: tembel katmanları kademeli yükle
    ['santral', 'bogaz', 'gdacs', 'piyasa', 'merkez', 'tahmin'].forEach((k, i) => {
      try {
        if(typeof YENI_D !== 'undefined' && YENI_D[k] && !YENI_D[k].geldi){
          setTimeout(() => { try { if(YUKLEYICI && YUKLEYICI[k]) YUKLEYICI[k](); } catch(e){} }, 800 + i * 900);
        }
      } catch(e){}
    });
    (function dongu(){ if(!hko.classList.contains('acik')) return; radarCiz(); requestAnimationFrame(dongu); })();
  }
  function kapat(){
    hko.classList.remove('acik'); document.body.classList.remove('hko');
    $1('#ek-hko').classList.remove('on');
    clearInterval(geziZaman); geziZaman = null;
    clearInterval(radarZaman); radarZaman = null;
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  }
  window.harekatAc = ac; window.harekatKapat = kapat;

  /* düğme */
  const d = document.createElement('button');
  d.id = 'ek-hko'; d.title = 'Harekât odası (askerî şura görünümü)';
  d.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.7" stroke-linecap="round"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z"/>' +
    '<path d="M12 8v5M12 16h.01"/></svg>';
  d.onclick = () => hko.classList.contains('acik') ? kapat() : ac();
  const sol = document.querySelector('#sol-alt');
  if(sol) sol.appendChild(d);
  $1('#hko-kapat').onclick = kapat;
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && hko.classList.contains('acik')) kapat();
  });
  console.log('[ÜSTAD GÖZCÜ] harekât odası hazır (düğme: ek-hko)');
})();
